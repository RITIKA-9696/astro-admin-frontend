  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Roboto', sans-serif
    }

    .sidebar-collapsed {
      width: 68px !important
    }

    .sidebar-collapsed .nav-label,
    .sidebar-collapsed .sidebar-brand-text,
    .sidebar-collapsed .sidebar-section-label {
      display: none !important
    }

    .sidebar-collapsed .nav-item {
      justify-content: center;
      padding-left: 0;
      padding-right: 0
    }

    .sidebar-collapsed .nav-icon {
      margin: 0
    }

    .main-expanded {
      margin-left: 68px !important
    }

    @media(max-width:1023px) {
      #sidebar {
        transform: translateX(-100%)
      }

      #sidebar.sidebar-open {
        transform: translateX(0)
      }

      #main-wrapper {
        margin-left: 0 !important
      }
    }

    .nav-active {
      background: #111844 !important;
      color: #EAE0CF !important
    }

    .drag-over {
      border: 2px dashed #4B5694 !important;
      background: #EAE0CF !important
    }

    .toast-animate {
      animation: slideIn 0.2s ease-out
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }
  </style>
</head>

    </nav>
    <div class="px-4 py-3 border-t border-[#4B5694]/30">
      <div class="flex items-center gap-3">
        <div
          class="w-8 h-8 rounded-full bg-[#4B5694] flex items-center justify-center text-[#EAE0CF] text-xs font-bold flex-shrink-0">
          AD</div>
        <div class="sidebar-brand-text min-w-0">
          <div class="text-[#EAE0CF] text-xs font-medium truncate">Admin</div>

  </aside>
  <div id="sidebar-overlay" class="hidden fixed inset-0 bg-[#111844]/50 z-[90] lg:hidden"></div>

  <div id="main-wrapper" class="ml-[260px] flex flex-col min-h-screen transition-all duration-300">

    <!-- HEADER -->
    <header
      class="sticky top-0 z-[200] h-16 bg-[#f5f0e8] border-b border-[#4B5694]/20 flex items-center justify-between px-5 shadow-sm">
      <div class="flex items-center gap-4">
        <button id="sidebar-toggle"
          class="w-9 h-9 flex items-center justify-center rounded-lg text-[#4B5694] hover:bg-[#4B5694]/10 transition-colors"><svg
            width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <line x1="3" y1="6" x2="21" y2="6" />

        <div>
          <h1 class="text-sm font-semibold text-[#111844]">Service Manager</h1>

              class="w-7 h-7 rounded-full bg-[#111844] flex items-center justify-center text-[#EAE0CF] text-xs font-bold">
              AD</div><span class="text-xs font-medium text-[#111844] hidden sm:block">Admin</span><svg width="12"

            class="hidden absolute right-0 top-full mt-1 w-44 bg-[#f5f0e8] border border-[#4B5694]/20 rounded-xl shadow-lg py-1 z-50">

              class="flex items-center gap-2 px-4 py-2 text-xs text-[#111844] hover:bg-[#7288AE]/10 transition-colors">👤
              Profile</a>
            <div class="border-t border-[#4B5694]/10 my-1"></div><a href="#"

              Logout</a>

    <main class="flex-1 p-5 space-y-4">
      <div class="flex items-center justify-between">
        <p class="text-xs text-[#7288AE]">Drag cards to reorder display on website</p>
        <button id="btn-add-service"
          class="flex items-center gap-2 px-4 py-2 bg-[#111844] text-[#EAE0CF] text-xs font-medium rounded-lg hover:bg-[#1d2a70] transition-colors shadow-sm">+
          Add Service</button>

      <!-- Service Cards Grid -->

  <!-- Modal Root -->
  <div id="modal-root"
    class="hidden fixed inset-0 z-[300] flex items-center justify-center bg-[#111844]/70 backdrop-blur-sm"
    style="display: none;">
    <div class="bg-card rounded-xl w-full max-w-md mx-4 shadow-2xl transform transition-all">
      <div class="flex items-center justify-between px-5 py-3 border-b border-[#4B5694]/15">
        <h3 id="modal-title" class="text-sm font-semibold text-[#111844]">Modal Title</h3>
        <button id="modal-close" class="text-[#7288AE] hover:text-[#111844] text-lg leading-none">&times;</button>
      </div>
      <div id="modal-body" class="p-5 max-h-[60vh] overflow-y-auto"></div>
      <div class="flex justify-end gap-2 px-5 py-3 border-t border-[#4B5694]/15 bg-[#EAE0CF]/30">
        <button id="modal-cancel"
          class="px-4 py-1.5 text-xs rounded-lg border border-[#4B5694]/30 hover:bg-[#4B5694]/10 transition-colors">Cancel</button>
        <button id="modal-confirm"
          class="px-4 py-1.5 text-xs rounded-lg bg-[#111844] text-[#EAE0CF] hover:bg-[#1d2a70] transition-colors">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-[400] space-y-2"></div>

  <script>
    // ============================================================
    // COMPLETE SAMPLE DATA MODULE (with auto-initialization)
    // ============================================================
    const SAMPLE_DATA_VERSION_SVC = 'astro_svc_v1';

    // Rich sample services data
    const SAMPLE_SERVICES = [
      { id: 'svc_1', name: 'Numerology Reading', icon: '🔢', description: 'Personalized numerology chart based on your birth date and name. Get insights into life path, destiny, and soul urge numbers.', active: true, order: 1 },
      { id: 'svc_2', name: 'Vedic Astrology', icon: '🌟', description: 'Kundli analysis and planetary predictions using ancient Vedic techniques. Career, marriage, and health insights.', active: true, order: 2 },
      { id: 'svc_3', name: 'Gemstone Recommendation', icon: '💎', description: 'Expert guidance on healing stones and gemstones based on your planetary alignment. Authentic stones suggested.', active: true, order: 3 },
      { id: 'svc_4', name: 'Tarot Card Reading', icon: '🃏', description: 'Intuitive tarot sessions for clarity on love, career, and spiritual growth. 3-card and Celtic cross spreads.', active: true, order: 4 },
      { id: 'svc_5', name: 'Vaastu Consultation', icon: '🏠', description: 'Energy alignment for homes and offices. Improve prosperity, health, and relationships through spatial harmony.', active: true, order: 5 },
      { id: 'svc_6', name: 'Palmistry Analysis', icon: '✋', description: 'Detailed palm reading revealing life line, heart line, and fate line insights. Understand your life path better.', active: false, order: 6 },
      { id: 'svc_7', name: 'Meditation Coaching', icon: '🧘', description: 'Personalized meditation techniques for stress relief and spiritual awakening. Guided sessions available.', active: false, order: 7 }
    ];

    // Initialize sample data in localStorage
    function initSampleServicesData() {
      const flag = localStorage.getItem('astro_sample_svc_initialized');
      if (flag !== SAMPLE_DATA_VERSION_SVC) {
        localStorage.setItem('astronumerics_services', JSON.stringify(SAMPLE_SERVICES));
        localStorage.setItem('astro_sample_svc_initialized', SAMPLE_DATA_VERSION_SVC);
        console.log('✅ Sample services data loaded!');
      }
    }

    // ============================================================
    // AN Namespace & Helper Functions
    // ============================================================
    window.AN = window.AN || {};

    AN.Store = {
      get: (key) => {
        const data = localStorage.getItem(key);
        return data ? JSON.parse(data) : [];
      },
      set: (key, value) => localStorage.setItem(key, JSON.stringify(value))
    };

    AN.STORAGE_KEYS = {
      SERVICES: 'astronumerics_services'
    };

    AN.genId = () => 'svc_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);

    // Toast notifications
    AN.Toast = {
      show: (message, type = 'success') => {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const toast = document.createElement('div');
        const bgColor = type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : type === 'info' ? 'bg-blue-600' : 'bg-gray-700';
        const icon = type === 'success' ? '✓' : type === 'error' ? '⚠' : type === 'info' ? 'ℹ' : '•';
        toast.className = `${bgColor} text-white text-xs px-4 py-2 rounded-lg shadow-lg toast-animate flex items-center gap-2`;
        toast.innerHTML = `<span>${icon}</span> ${message}`;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
      },
      success: (msg) => AN.Toast.show(msg, 'success'),
      error: (msg) => AN.Toast.show(msg, 'error'),
      info: (msg) => AN.Toast.show(msg, 'info')
    };

    AN.makeToggle = (initialChecked, onChange) => {
      const label = document.createElement('label');
      label.className = 'relative inline-flex items-center cursor-pointer';
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.className = 'sr-only peer';
      input.checked = initialChecked;
      const div = document.createElement('div');
      div.className = "w-9 h-5 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-[#111844]";
      label.appendChild(input);
      label.appendChild(div);
      input.addEventListener('change', (e) => onChange(e.target.checked));
      return label;
    };

    AN.confirmDelete = (name, callback) => {
      const modal = document.getElementById('modal-root');
      if (!modal) return;
      document.getElementById('modal-title').innerText = 'Confirm Delete';
      document.getElementById('modal-body').innerHTML = `<p class="text-sm text-[#111844]">Are you sure you want to delete "<strong>${escapeHtml(name)}</strong>"? This action cannot be undone.</p>`;
      modal.style.display = 'flex';
      const confirmBtn = document.getElementById('modal-confirm');
      const cancelBtn = document.getElementById('modal-cancel');
      const closeBtn = document.getElementById('modal-close');
      const cleanup = () => {
        modal.style.display = 'none';
        confirmBtn.removeEventListener('click', handler);
        cancelBtn.removeEventListener('click', cleanup);
        closeBtn.removeEventListener('click', cleanup);
      };
      const handler = () => { cleanup(); if (callback) callback(); };
      confirmBtn.addEventListener('click', handler);
      cancelBtn.addEventListener('click', cleanup);
      closeBtn.addEventListener('click', cleanup);
    };

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }

    // Modal handler
    let currentModalConfirmCallback = null;
    function showModal(title, bodyHtml, onConfirm, confirmText = 'Confirm') {
      const modal = document.getElementById('modal-root');
      if (!modal) return;
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-body').innerHTML = bodyHtml;
      document.getElementById('modal-confirm').innerText = confirmText;
      modal.style.display = 'flex';
      const confirmBtn = document.getElementById('modal-confirm');
      const cancelBtn = document.getElementById('modal-cancel');
      const closeBtn = document.getElementById('modal-close');
      const cleanup = () => {
        modal.style.display = 'none';
        confirmBtn.removeEventListener('click', handler);
        cancelBtn.removeEventListener('click', cleanup);
        closeBtn.removeEventListener('click', cleanup);
      };
      const handler = () => {
        if (onConfirm && onConfirm() !== false) cleanup();
        else if (!onConfirm) cleanup();
      };
      confirmBtn.addEventListener('click', handler);
      cancelBtn.addEventListener('click', cleanup);
      closeBtn.addEventListener('click', cleanup);
    }

    // ============================================================
    // MAIN DASHBOARD LOGIC
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
      initSampleServicesData();

      let data = AN.Store.get(AN.STORAGE_KEYS.SERVICES) || [];

      // Ensure all services have order property and sort
      if (data.length > 0 && !data.some(s => typeof s.order === 'number')) {
        data.forEach((s, idx) => s.order = idx + 1);
        AN.Store.set(AN.STORAGE_KEYS.SERVICES, data);
      }

      function save() {
        AN.Store.set(AN.STORAGE_KEYS.SERVICES, data);
      }

      function render() {
        const grid = document.getElementById('services-grid');
        if (!grid) return;
        grid.innerHTML = '';
        const sorted = [...data].sort((a, b) => (a.order || 999) - (b.order || 999));

        sorted.forEach(svc => {
          const card = document.createElement('div');
          card.className = 'bg-card rounded-xl border border-[#4B5694]/20 shadow-sm p-4 cursor-grab active:cursor-grabbing transition-all duration-150 hover:shadow-md';
          card.draggable = true;
          card.dataset.id = svc.id;

          const toggle = AN.makeToggle(svc.active === true, (checked) => {
            svc.active = checked;
            save();
            AN.Toast.info(`${svc.name} ${checked ? 'enabled' : 'disabled'}`);
          });

          card.innerHTML = `
        <div class="flex items-start justify-between mb-3">
          <div class="flex items-center gap-2">
            <span class="text-2xl">${svc.icon || '✨'}</span>
            <div>
              <div class="font-semibold text-sm text-[#111844]">${escapeHtml(svc.name)}</div>
              <div class="text-xs text-[#7288AE]">Order #${svc.order || '—'}</div>
            </div>
          </div>
          <div class="toggle-wrap"></div>
        </div>
        <p class="text-xs text-[#4B5694] mb-4 leading-relaxed">${escapeHtml(svc.description || '—')}</p>
        <div class="flex items-center gap-2 pt-3 border-t border-[#4B5694]/10">
          <button data-edit="${svc.id}" class="flex-1 py-1.5 text-xs rounded-lg bg-[#111844]/10 text-[#111844] hover:bg-[#111844]/20 transition-colors">Edit</button>
          <button data-del="${svc.id}" class="flex-1 py-1.5 text-xs rounded-lg bg-red-50 text-red-600 hover:bg-red-100 transition-colors">Delete</button>
        </div>`;

          const toggleWrap = card.querySelector('.toggle-wrap');
          if (toggleWrap) toggleWrap.appendChild(toggle);

          const editBtn = card.querySelector('[data-edit]');
          const delBtn = card.querySelector('[data-del]');
          if (editBtn) editBtn.addEventListener('click', () => openEdit(svc.id));
          if (delBtn) delBtn.addEventListener('click', () => {
            AN.confirmDelete(svc.name, () => {
              data = data.filter(s => s.id !== svc.id);
              // Reorder remaining services
              data.forEach((s, idx) => s.order = idx + 1);
              save();
              render();
              AN.Toast.success('Service deleted');
            });
          });

          // Drag & Drop functionality
          card.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('text/plain', svc.id);
            card.classList.add('opacity-50');
          });
          card.addEventListener('dragend', () => card.classList.remove('opacity-50'));
          card.addEventListener('dragover', (e) => {
            e.preventDefault();
            card.classList.add('drag-over');
          });
          card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
          card.addEventListener('drop', (e) => {
            e.preventDefault();
            card.classList.remove('drag-over');
            const fromId = e.dataTransfer.getData('text/plain');
            const toId = svc.id;
            if (fromId === toId) return;

            const fromIdx = data.findIndex(s => s.id === fromId);
            const toIdx = data.findIndex(s => s.id === toId);
            if (fromIdx === -1 || toIdx === -1) return;

            const [moved] = data.splice(fromIdx, 1);
            data.splice(toIdx, 0, moved);
            data.forEach((s, idx) => s.order = idx + 1);
            save();
            render();
            AN.Toast.success('Order updated');
          });

          grid.appendChild(card);
        });

        // Show empty state if no services
        if (data.length === 0) {
          grid.innerHTML = `<div class="col-span-full text-center py-12 text-[#7288AE] text-sm">No services added yet. Click "+ Add Service" to get started.</div>`;
        }
      }

      function buildForm(svc = null) {
        const isEdit = svc !== null;
        const currentOrder = svc ? svc.order : (data.length + 1);
        return `<div class="space-y-3">
      <div>
        <label class="block text-xs font-medium text-[#4B5694] mb-1">Service Name *</label>
        <input name="name" value="${escapeHtml(svc?.name || '')}" type="text" placeholder="e.g., Tarot Reading" class="w-full text-xs px-3 py-2 rounded-lg border border-[#4B5694]/30 bg-[#EAE0CF] focus:outline-none focus:border-[#4B5694]" />
      </div>
      <div>
        <label class="block text-xs font-medium text-[#4B5694] mb-1">Icon (emoji)</label>
        <input name="icon" value="${svc?.icon || ''}" type="text" placeholder="🃏" class="w-full text-xs px-3 py-2 rounded-lg border border-[#4B5694]/30 bg-[#EAE0CF] focus:outline-none focus:border-[#4B5694]" />
      </div>
      <div>
        <label class="block text-xs font-medium text-[#4B5694] mb-1">Short Description</label>
        <textarea name="description" rows="3" class="w-full text-xs px-3 py-2 rounded-lg border border-[#4B5694]/30 bg-[#EAE0CF] focus:outline-none focus:border-[#4B5694] resize-none">${escapeHtml(svc?.description || '')}</textarea>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-[#4B5694] mb-1">Sort Order</label>
          <input name="order" value="${currentOrder}" type="number" min="1" class="w-full text-xs px-3 py-2 rounded-lg border border-[#4B5694]/30 bg-[#EAE0CF] focus:outline-none focus:border-[#4B5694]" />
        </div>
        <div class="flex items-end pb-2">
          <label class="flex items-center gap-2 cursor-pointer">
            <input name="active" type="checkbox" ${svc?.active !== false ? 'checked' : ''} class="w-4 h-4 accent-[#111844]" />
            <span class="text-xs text-[#4B5694]">Active (show on site)</span>
          </label>
        </div>
      </div>
      <input name="id" type="hidden" value="${svc?.id || ''}" />
    </div>`;
      }

      function openEdit(id) {
        const svc = data.find(s => s.id === id);
        if (!svc) return;

        showModal('Edit Service', buildForm(svc), () => {
          const nameInput = document.querySelector('#modal-body [name="name"]');
          const name = nameInput?.value.trim();
          if (!name) { AN.Toast.error('Service name is required'); return false; }

          svc.name = name;
          svc.icon = document.querySelector('#modal-body [name="icon"]')?.value.trim() || '';
          svc.description = document.querySelector('#modal-body [name="description"]')?.value.trim() || '';
          svc.order = parseInt(document.querySelector('#modal-body [name="order"]')?.value) || svc.order;
          svc.active = document.querySelector('#modal-body [name="active"]')?.checked === true;

          // Reorder all services based on updated order values
          data.sort((a, b) => (a.order || 999) - (b.order || 999));
          data.forEach((s, idx) => s.order = idx + 1);

          save();
          render();
          AN.Toast.success('Service updated!');
        }, 'Save Changes');
      }

      // Add new service
      document.getElementById('btn-add-service')?.addEventListener('click', () => {
        showModal('Add New Service', buildForm(null), () => {
          const nameInput = document.querySelector('#modal-body [name="name"]');
          const name = nameInput?.value.trim();
          if (!name) { AN.Toast.error('Service name is required'); return false; }

          const newOrder = data.length + 1;
          const newService = {
            id: AN.genId(),
            name: name,
            icon: document.querySelector('#modal-body [name="icon"]')?.value.trim() || '✨',
            description: document.querySelector('#modal-body [name="description"]')?.value.trim() || '',
            order: newOrder,
            active: document.querySelector('#modal-body [name="active"]')?.checked === true
          };

          data.push(newService);
          save();
          render();
          AN.Toast.success('Service added successfully!');
        }, 'Add Service');
      });

      // Sidebar toggle functionality
      const sidebarToggle = document.getElementById('sidebar-toggle');
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');

      if (sidebarToggle) {
        sidebarToggle.addEventListener('click', () => {
          if (window.innerWidth < 1024) {
            sidebar.classList.toggle('sidebar-open');
            overlay?.classList.toggle('hidden');
          } else {
            const mainWrapper = document.getElementById('main-wrapper');
            sidebar.classList.toggle('sidebar-collapsed');
            if (sidebar.classList.contains('sidebar-collapsed')) {
              mainWrapper?.classList.add('main-expanded');
              mainWrapper && (mainWrapper.style.marginLeft = '68px');
            } else {
              mainWrapper?.classList.remove('main-expanded');
              mainWrapper && (mainWrapper.style.marginLeft = '');
            }
          }
        });
      }

      overlay?.addEventListener('click', () => {
        sidebar?.classList.remove('sidebar-open');
        overlay.classList.add('hidden');
      });

      // User menu dropdown
      const userMenuBtn = document.getElementById('user-menu-btn');
      const userMenu = document.getElementById('user-menu');
      if (userMenuBtn && userMenu) {
        userMenuBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          userMenu.classList.toggle('hidden');
        });
        document.addEventListener('click', (e) => {
          if (!userMenuBtn.contains(e.target) && !userMenu.contains(e.target)) {
            userMenu.classList.add('hidden');
          }
        });
      }

      // Notification button
      document.getElementById('notif-btn')?.addEventListener('click', () => {
        AN.Toast.info('No new notifications at this time');
      });

      render();
    });
  </script>
</body>

</html>
