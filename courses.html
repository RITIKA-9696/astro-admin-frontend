<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Testimonials — Astro Numerics Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{active:'#111844',border2:'#4B5694',bg:'#EAE0CF',hover2:'#7288AE',card:'#f5f0e8',dark:'#1a2155'}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <style>
    body{font-family:'Roboto',sans-serif}
    .sidebar-collapsed{width:68px!important}.sidebar-collapsed .nav-label,.sidebar-collapsed .sidebar-brand-text,.sidebar-collapsed .sidebar-section-label{display:none!important}.sidebar-collapsed .nav-item{justify-content:center;padding-left:0;padding-right:0}.sidebar-collapsed .nav-icon{margin:0}.main-expanded{margin-left:68px!important}

    .nav-active{background:#111844!important;color:#EAE0CF!important}
  </style>
</head>
<body class="bg-[#EAE0CF] text-[#111844] min-h-screen">

<!-- SIDEBAR -->
<aside id="sidebar" class="fixed top-0 left-0 h-full w-[260px] bg-[#111844] z-[100] flex flex-col transition-all duration-300 overflow-hidden">
  <div class="flex items-center gap-3 px-5 py-4 border-b border-[#4B5694]/30"><div class="w-9 h-9 rounded-lg bg-[#EAE0CF] flex items-center justify-center text-[#111844] font-bold text-base flex-shrink-0">✦</div><div class="sidebar-brand-text min-w-0"><div class="text-[#EAE0CF] font-semibold text-sm leading-tight truncate">Astro Numerics</div><div class="text-[#7288AE] text-xs leading-tight">Admin Panel</div></div></div>
  <nav class="flex-1 overflow-y-auto py-3 px-2 space-y-0.5">
    <div class="sidebar-section-label px-3 pt-2 pb-1 text-[10px] font-semibold uppercase tracking-wider text-[#4B5694]">Main</div>
    <a href="index.html" data-nav-link class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#EAE0CF]/70 hover:bg-[#7288AE]/20 hover:text-[#EAE0CF] transition-colors duration-150 text-sm"><span class="nav-icon text-base flex-shrink-0">⊞</span><span class="nav-label">Dashboard</span></a>
    <a href="inquiries.html" data-nav-link class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#EAE0CF]/70 hover:bg-[#7288AE]/20 hover:text-[#EAE0CF] transition-colors duration-150 text-sm"><span class="nav-icon text-base flex-shrink-0">💬</span><span class="nav-label">Inquiries / Leads</span></a>
    <div class="sidebar-section-label px-3 pt-3 pb-1 text-[10px] font-semibold uppercase tracking-wider text-[#4B5694]">Manage</div>
    <a href="services.html" data-nav-link class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#EAE0CF]/70 hover:bg-[#7288AE]/20 hover:text-[#EAE0CF] transition-colors duration-150 text-sm"><span class="nav-icon text-base flex-shrink-0">✨</span><span class="nav-label">Services</span></a>
    <a href="testimonials.html" data-nav-link class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#EAE0CF]/70 hover:bg-[#7288AE]/20 hover:text-[#EAE0CF] transition-colors duration-150 text-sm"><span class="nav-icon text-base flex-shrink-0">⭐</span><span class="nav-label">Testimonials</span></a>
    <a href="certificates.html" data-nav-link class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#EAE0CF]/70 hover:bg-[#7288AE]/20 hover:text-[#EAE0CF] transition-colors duration-150 text-sm"><span class="nav-icon text-base flex-shrink-0">🏅</span><span class="nav-label">Certificates</span></a>
    <a href="courses.html" data-nav-link class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#EAE0CF]/70 hover:bg-[#7288AE]/20 hover:text-[#EAE0CF] transition-colors duration-150 text-sm"><span class="nav-icon text-base flex-shrink-0">📚</span><span class="nav-label">Courses</span></a>
    <a href="products.html" data-nav-link class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#EAE0CF]/70 hover:bg-[#7288AE]/20 hover:text-[#EAE0CF] transition-colors duration-150 text-sm"><span class="nav-icon text-base flex-shrink-0">💎</span><span class="nav-label">Products</span></a>
  </nav>
  <div class="px-4 py-3 border-t border-[#4B5694]/30"><div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-[#4B5694] flex items-center justify-center text-[#EAE0CF] text-xs font-bold flex-shrink-0">AD</div><div class="sidebar-brand-text min-w-0"><div class="text-[#EAE0CF] text-xs font-medium truncate">Admin</div><div class="text-[#7288AE] text-xs truncate">admin@astronumerics.in</div></div></div></div>
</aside>
<div id="sidebar-overlay" class="hidden fixed inset-0 bg-[#111844]/50 z-[90] lg:hidden"></div>

<div id="main-wrapper" class="ml-[260px] flex flex-col min-h-screen transition-all duration-300">
  <header class="sticky top-0 z-[200] h-16 bg-[#f5f0e8] border-b border-[#4B5694]/20 flex items-center justify-between px-5 shadow-sm">
    <div class="flex items-center gap-4"><button id="sidebar-toggle" class="w-9 h-9 flex items-center justify-center rounded-lg text-[#4B5694] hover:bg-[#4B5694]/10 transition-colors"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button><div><h1 class="text-sm font-semibold text-[#111844]">Testimonial Manager</h1><p class="text-xs text-[#7288AE]">Approve, hide and manage client reviews</p></div></div>
    <div class="flex items-center gap-2"><button id="notif-btn" class="w-9 h-9 flex items-center justify-center rounded-lg text-[#4B5694] hover:bg-[#4B5694]/10 transition-colors relative"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full"></span></button><div class="relative"><button id="user-menu-btn" class="flex items-center gap-2 px-3 py-1.5 rounded-lg hover:bg-[#4B5694]/10 transition-colors"><div class="w-7 h-7 rounded-full bg-[#111844] flex items-center justify-center text-[#EAE0CF] text-xs font-bold">AD</div><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></button><div id="user-menu" class="hidden absolute right-0 top-full mt-1 w-44 bg-[#f5f0e8] border border-[#4B5694]/20 rounded-xl shadow-lg py-1 z-50"><a href="#" class="flex items-center gap-2 px-4 py-2 text-xs text-red-600 hover:bg-red-50 transition-colors">🚪 Logout</a></div></div></div>
  </header>

  <main class="flex-1 p-5 space-y-4">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div class="flex gap-2" id="testi-filter-btns">
        <button data-filter="" class="filter-btn px-3 py-1.5 text-xs rounded-lg bg-[#111844] text-[#EAE0CF] font-medium transition-colors">All</button>
        <button data-filter="Approved" class="filter-btn px-3 py-1.5 text-xs rounded-lg border border-[#4B5694]/30 text-[#4B5694] hover:bg-[#4B5694]/10 transition-colors">Approved</button>
        <button data-filter="Hidden"   class="filter-btn px-3 py-1.5 text-xs rounded-lg border border-[#4B5694]/30 text-[#4B5694] hover:bg-[#4B5694]/10 transition-colors">Hidden</button>
      </div>
      <button id="btn-add-testi" class="flex items-center gap-2 px-4 py-2 bg-[#111844] text-[#EAE0CF] text-xs font-medium rounded-lg hover:bg-[#1d2a70] transition-colors shadow-sm">+ Add Testimonial</button>
    </div>

    <!-- Cards Grid -->
    <div id="testi-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    <div id="testi-empty" class="hidden text-center py-10 text-xs text-[#7288AE]">No testimonials found</div>
  </main>
</div>

<script src="assets/js/common.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const { Store, STORAGE_KEYS, genId, Toast, Modal, statusBadge, starRating, confirmDelete } = AN;
  let data = Store.get(STORAGE_KEYS.TESTIMONIALS) || [];
  let services = Store.get(STORAGE_KEYS.SERVICES) || [];
  let filterStatus = '';
  function save() { Store.set(STORAGE_KEYS.TESTIMONIALS, data); }

  function render() {
    const filtered = filterStatus ? data.filter(t => t.status === filterStatus) : data;
    const grid = document.getElementById('testi-grid');
    const empty = document.getElementById('testi-empty');
    grid.innerHTML = '';
    empty.style.display = filtered.length ? 'none' : '';

    filtered.forEach(t => {
      const card = document.createElement('div');
      card.className = `bg-card rounded-xl border shadow-sm p-4 transition-all duration-150 ${t.status === 'Hidden' ? 'opacity-60 border-gray-200' : 'border-[#4B5694]/20'}`;
      card.innerHTML = `
        <div class="flex items-start gap-3 mb-3">
          <div class="w-9 h-9 rounded-full bg-[#111844] flex items-center justify-center text-[#EAE0CF] text-xs font-bold flex-shrink-0">${t.initial || t.name.slice(0,2).toUpperCase()}</div>
          <div class="flex-1 min-w-0">
            <div class="font-semibold text-sm text-[#111844] truncate">${t.name}</div>
            <div class="text-xs text-[#7288AE] truncate">${t.service}</div>
          </div>
          <div>${statusBadge(t.status)}</div>
        </div>
        <div class="text-xs text-[#4B5694] leading-relaxed mb-3 line-clamp-3">"${t.review}"</div>
        <div class="flex items-center justify-between pt-3 border-t border-[#4B5694]/10">
          <div class="flex items-center gap-0.5 text-sm">${starRating(t.rating)}</div>
          <div class="flex items-center gap-1.5">
            <button data-toggle="${t.id}" class="px-2.5 py-1 text-xs rounded ${t.status==='Approved'?'bg-gray-100 text-gray-600 hover:bg-gray-200':'bg-green-100 text-green-700 hover:bg-green-200'} transition-colors">${t.status==='Approved'?'Hide':'Approve'}</button>
            <button data-edit="${t.id}" class="px-2.5 py-1 text-xs rounded bg-[#111844]/10 text-[#111844] hover:bg-[#111844]/20 transition-colors">Edit</button>
            <button data-del="${t.id}" class="px-2.5 py-1 text-xs rounded bg-red-50 text-red-600 hover:bg-red-100 transition-colors">Del</button>
          </div>
        </div>`;

      card.querySelector('[data-toggle]').addEventListener('click', () => {
        t.status = t.status === 'Approved' ? 'Hidden' : 'Approved';
        save(); render(); Toast.info(`${t.name}'s review ${t.status.toLowerCase()}`);
      });
      card.querySelector('[data-edit]').addEventListener('click', () => openEdit(t.id));
      card.querySelector('[data-del]').addEventListener('click', () => {
        confirmDelete(t.name + "'s review", () => { data = data.filter(i => i.id !== t.id); save(); render(); Toast.success('Deleted'); });
      });
      grid.appendChild(card);
    });
  }

  function buildForm(t = {}) {
    const svcOpts = services.map(s => `<option${t.service===s.name?' selected':''}>${s.name}</option>`).join('');
    return `<div class="space-y-3">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-[#4B5694] mb-1">Client Name *</label>
          <input name="name" value="${t.name||''}" type="text" placeholder="Priya Sharma" class="w-full text-xs px-3 py-2 rounded-lg border border-[#4B5694]/30 bg-[#EAE0CF] focus:outline-none focus:border-[#4B5694]"/>
        </div>
        <div>
          <label class="block text-xs font-medium text-[#4B5694] mb-1">Initials (e.g. AK)</label>
          <input name="initial" value="${t.initial||''}" type="text" maxlength="3" placeholder="AK" class="w-full text-xs px-3 py-2 rounded-lg border border-[#4B5694]/30 bg-[#EAE0CF] focus:outline-none focus:border-[#4B5694]"/>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-[#4B5694] mb-1">Service Used</label>
          <select name="service" class="w-full text-xs px-3 py-2 rounded-lg border border-[#4B5694]/30 bg-[#EAE0CF] focus:outline-none focus:border-[#4B5694]"><option value="">Select…</option>${svcOpts}</select>
        </div>
        <div>
          <label class="block text-xs font-medium text-[#4B5694] mb-1">Rating</label>
          <select name="rating" class="w-full text-xs px-3 py-2 rounded-lg border border-[#4B5694]/30 bg-[#EAE0CF] focus:outline-none focus:border-[#4B5694]">
            ${[5,4,3,2,1].map(n=>`<option${(t.rating||5)===n?' selected':''}>${n} ★</option>`).join('')}
          </select>
        </div>
      </div>
      <div>
        <label class="block text-xs font-medium text-[#4B5694] mb-1">Review Text *</label>
        <textarea name="review" rows="3" placeholder="Client's review…" class="w-full text-xs px-3 py-2 rounded-lg border border-[#4B5694]/30 bg-[#EAE0CF] focus:outline-none focus:border-[#4B5694] resize-none">${t.review||''}</textarea>
      </div>
      <div>
        <label class="block text-xs font-medium text-[#4B5694] mb-1">Status</label>
        <select name="status" class="w-full text-xs px-3 py-2 rounded-lg border border-[#4B5694]/30 bg-[#EAE0CF] focus:outline-none focus:border-[#4B5694]">
          <option${(t.status||'Approved')==='Approved'?' selected':''}>Approved</option>
          <option${t.status==='Hidden'?' selected':''}>Hidden</option>
        </select>
      </div>
      <input name="id" type="hidden" value="${t.id||''}"/>
    </div>`;
  }

  function openEdit(id) {
    const t = data.find(x => x.id === id);
    Modal.create({ title:'Edit Testimonial', body: buildForm(t), size:'md',
      onConfirm: () => {
        const f = document.querySelector('#an-modal');
        Object.assign(t, {
          name: f.querySelector('[name="name"]').value.trim(),
          initial: f.querySelector('[name="initial"]').value.trim().toUpperCase(),
          service: f.querySelector('[name="service"]').value,
          rating: parseInt(f.querySelector('[name="rating"]').value),
          review: f.querySelector('[name="review"]').value.trim(),
          status: f.querySelector('[name="status"]').value,
        });
        save(); render(); Toast.success('Testimonial updated!');
      }, confirmText:'Save Changes'
    });
  }

  document.getElementById('btn-add-testi').addEventListener('click', () => {
    Modal.create({ title:'Add Testimonial', body: buildForm(), size:'md',
      onConfirm: () => {
        const f    = document.querySelector('#an-modal');
        const name = f.querySelector('[name="name"]').value.trim();
        const review = f.querySelector('[name="review"]').value.trim();
        if (!name || !review) { Toast.error('Name and review are required'); return; }
        data.unshift({ id: genId(), name, initial: f.querySelector('[name="initial"]').value.trim().toUpperCase() || name.slice(0,2).toUpperCase(), service: f.querySelector('[name="service"]').value, rating: parseInt(f.querySelector('[name="rating"]').value)||5, review, status: f.querySelector('[name="status"]').value });
        save(); render(); Toast.success('Testimonial added!');
      }, confirmText:'Add Testimonial'
    });
  });

  // Filter buttons
  document.getElementById('testi-filter-btns').addEventListener('click', e => {
    const btn = e.target.closest('[data-filter]');
    if (!btn) return;
    filterStatus = btn.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.className = b === btn
        ? 'filter-btn px-3 py-1.5 text-xs rounded-lg bg-[#111844] text-[#EAE0CF] font-medium transition-colors'
        : 'filter-btn px-3 py-1.5 text-xs rounded-lg border border-[#4B5694]/30 text-[#4B5694] hover:bg-[#4B5694]/10 transition-colors';
    });
    render();
  });

  render();
});
</script>
</body>
</html>
