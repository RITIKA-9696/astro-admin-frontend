<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Astro Numerics Admin</title>
    <link rel="stylesheet" href="css/admin.css">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #111844 0%, #4B5694 100%);
            margin: 0;
            padding: 20px;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeInUp 0.5s ease;
        }
        .login-card h2 {
            text-align: center;
            color: #111844;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
        .login-card h3 {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9rem;
            font-weight: normal;
        }
        .demo-credentials {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 0.8rem;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        @keyframes fadeInUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--active-bg);
            box-shadow: 0 0 0 3px rgba(17, 24, 68, 0.1);
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--active-bg);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            background: var(--hover-bg);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2>✨ Astro Numerics</h2>
            <h3>Admin Panel Login</h3>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" required placeholder="admin@astronumerics.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" required placeholder="••••••">
                </div>
                <div id="loginError" class="alert alert-error" style="display: none;"></div>
                <button type="submit" class="btn-primary">Login to Dashboard</button>
            </form>
            <div class="demo-credentials">
                <strong>🔐 Demo Credentials</strong><br>
                📧 Email: admin@astronumerics.com<br>
                🔑 Password: admin123
            </div>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
