<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Astro Numerics Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f1633 0%, #1a2155 50%, #2a3570 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background elements */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(circle, rgba(75, 86, 148, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: moveStars 60s linear infinite;
            pointer-events: none;
        }

        @keyframes moveStars {
            0% {
                transform: translate(0, 0);
            }
            100% {
                transform: translate(50px, 50px);
            }
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 45px 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.6s ease;
            border: 1px solid rgba(75, 86, 148, 0.2);
        }

        @keyframes fadeInUp {
            from {
                transform: translateY(40px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #111844 0%, #4B5694 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            box-shadow: 0 10px 25px -5px rgba(17, 24, 68, 0.3);
        }

        .logo-icon i {
            font-size: 32px;
            color: white;
        }

        .login-card h2 {
            text-align: center;
            color: #111844;
            margin-bottom: 8px;
            font-size: 1.8rem;
            font-weight: 600;
        }

        .login-card h3 {
            text-align: center;
            color: #6b7280;
            margin-bottom: 35px;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #374151;
        }

        .form-group label i {
            margin-right: 8px;
            color: #4B5694;
            width: 16px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 16px;
        }

        .form-control {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: 1.5px solid #e5e7eb;
            border-radius: 12px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            font-family: 'Roboto', sans-serif;
        }

        .form-control:focus {
            outline: none;
            border-color: #4B5694;
            box-shadow: 0 0 0 3px rgba(75, 86, 148, 0.1);
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #9ca3af;
            transition: color 0.3s;
        }

        .password-toggle:hover {
            color: #4B5694;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #6b7280;
            cursor: pointer;
        }

        .checkbox-label input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #4B5694;
        }

        .forgot-link {
            font-size: 0.8rem;
            color: #4B5694;
            text-decoration: none;
            transition: color 0.3s;
        }

        .forgot-link:hover {
            color: #111844;
            text-decoration: underline;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #111844 0%, #4B5694 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(17, 24, 68, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .demo-credentials {
            background: linear-gradient(135deg, #f8f9fc 0%, #f0f2f8 100%);
            padding: 16px;
            border-radius: 12px;
            margin-top: 25px;
            font-size: 0.8rem;
            text-align: center;
            border: 1px solid #e5e7eb;
        }

        .demo-credentials strong {
            display: block;
            margin-bottom: 8px;
            color: #111844;
            font-size: 0.85rem;
        }

        .demo-credentials p {
            margin: 5px 0;
            color: #4b5563;
        }

        .demo-credentials i {
            margin-right: 6px;
            color: #4B5694;
            width: 20px;
        }

        .alert {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .alert i {
            font-size: 16px;
        }

        .footer-text {
            text-align: center;
            margin-top: 25px;
            font-size: 0.7rem;
            color: #9ca3af;
        }

        .footer-text a {
            color: #4B5694;
            text-decoration: none;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        /* Loading state */
        .btn-primary.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-primary.loading i {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-star-of-life"></i>
                </div>
                <h2>Astro Numerics</h2>
                <h3>ADMIN PANEL LOGIN</h3>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" class="form-control" required placeholder="admin@astronumerics.com" value="admin@astronumerics.com">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <div class="password-wrapper">
                        <i class="fas fa-lock" style="left: 12px; position: absolute; top: 50%; transform: translateY(-50%); z-index: 1;"></i>
                        <input type="password" id="password" class="form-control" required placeholder="Enter your password" style="padding-right: 40px;" value="admin123">
                        <i class="fas fa-eye password-toggle" id="togglePassword"></i>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <i class="fas fa-check-circle" style="color: #4B5694;"></i> Remember me
                    </label>
                    <a href="#" class="forgot-link">
                        <i class="fas fa-question-circle"></i> Forgot Password?
                    </a>
                </div>

                <div id="loginError" class="alert alert-error" style="display: none;">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span id="errorMessage"></span>
                </div>

                <button type="submit" class="btn-primary" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i>
                    Login to Dashboard
                </button>
            </form>

            <div class="demo-credentials">
                <strong><i class="fas fa-key"></i> Demo Credentials</strong>
                <p><i class="fas fa-envelope"></i> Email: admin@astronumerics.com</p>
                <p><i class="fas fa-lock"></i> Password: admin123</p>
                <p style="font-size: 0.7rem; margin-top: 8px; color: #6b7280;">
                    <i class="fas fa-info-circle"></i> Click Login to access admin panel
                </p>
            </div>

            <div class="footer-text">
                <i class="fas fa-copyright"></i> 2024 Astro Numerics. All rights reserved.
            </div>
        </div>
    </div>

    <script>
        // Password visibility toggle
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        if (togglePassword) {
            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');
            });
        }

        // Set remember me from localStorage
        const rememberCheckbox = document.getElementById('rememberMe');
        const emailInput = document.getElementById('email');
        
        if (localStorage.getItem('rememberedEmail')) {
            emailInput.value = localStorage.getItem('rememberedEmail');
            rememberCheckbox.checked = true;
        }

        // Handle form submission
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const errorMessage = document.getElementById('errorMessage');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            
            // Validate inputs
            if (!email || !password) {
                showError('Please enter both email and password');
                return;
            }
            
            if (!isValidEmail(email)) {
                showError('Please enter a valid email address');
                return;
            }
            
            // Show loading state
            loginBtn.classList.add('loading');
            loginBtn.innerHTML = '<i class="fas fa-spinner"></i> Logging in...';
            loginError.style.display = 'none';
            
            // Simulate API call (replace with actual authentication)
            setTimeout(() => {
                // Demo authentication
                if (email === 'admin@astronumerics.com' && password === 'admin123') {
                    // Success
                    if (rememberCheckbox.checked) {
                        localStorage.setItem('rememberedEmail', email);
                    } else {
                        localStorage.removeItem('rememberedEmail');
                    }
                    
                    // Store auth token (for demo purposes)
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userEmail', email);
                    
                    // Redirect to dashboard
                    window.location.href = '/index.html';
                } else {
                    // Error
                    showError('Invalid email or password. Please try again.');
                    loginBtn.classList.remove('loading');
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login to Dashboard';
                }
            }, 800);
        });
        
        function showError(message) {
            errorMessage.textContent = message;
            loginError.style.display = 'flex';
            
            // Auto hide after 5 seconds
            setTimeout(() => {
                loginError.style.display = 'none';
            }, 5000);
        }
        
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }
        
        // Add floating label effect
        const inputs = document.querySelectorAll('.form-control');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.parentElement.classList.add('focused');
            });
            
            input.addEventListener('blur', function() {
                if (!this.value) {
                    this.parentElement.parentElement.classList.remove('focused');
                }
            });
        });
        
        // Prevent form submission on Enter key if not allowed
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && document.activeElement === passwordInput) {
                e.preventDefault();
                loginForm.dispatchEvent(new Event('submit'));
            }
        });
        
        // Add some interactive effects
        const loginCard = document.querySelector('.login-card');
        loginCard.addEventListener('mouseenter', () => {
            loginCard.style.transform = 'translateY(-5px)';
            loginCard.style.transition = 'all 0.3s ease';
        });
        
        loginCard.addEventListener('mouseleave', () => {
            loginCard.style.transform = 'translateY(0)';
        });
        
        // Check if already logged in
        if (localStorage.getItem('isLoggedIn') === 'true' && window.location.pathname !== '/index.html') {
            window.location.href = '/index.html';
        }
    </script>
</body>
</html>
