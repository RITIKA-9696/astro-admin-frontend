            { id: 'inq_6', name: 'Arjun Reddy', mobile: '9700011223', service: 'Vedic Astrology', status: 'Follow-up', wpClicks: 3, date: '2025-05-26', notes: 'Asked about marriage timeline' },
            { id: 'inq_7', name: 'Sneha Desai', mobile: '9876501234', service: 'Tarot Card Reading', status: 'New', wpClicks: 1, date: '2025-05-25', notes: 'Career guidance required' },
            { id: 'inq_8', name: 'Karthik Iyer', mobile: '9955667788', service: 'Gemstone Recommendation', status: 'Contacted', wpClicks: 2, date: '2025-05-24', notes: 'Interested in emerald' },
            { id: 'inq_9', name: 'Divya Menon', mobile: '9988223344', service: 'Numerology Reading', status: 'Session Done', wpClicks: 4, date: '2025-05-23', notes: 'Great session, planning to buy report' },
            { id: 'inq_10', name: 'Amit Khanna', mobile: '9876112233', service: 'Vaastu Consultation', status: 'New', wpClicks: 0, date: '2025-05-22', notes: 'Home vaastu for new flat' },
            { id: 'inq_11', name: 'Shreya Joshi', mobile: '9900112233', service: 'Vedic Astrology', status: 'Follow-up', wpClicks: 2, date: '2025-05-21', notes: 'Asked for horoscope matching' },
            { id: 'inq_12', name: 'Manoj Tiwari', mobile: '9812345678', service: 'Gemstone Recommendation', status: 'Contacted', wpClicks: 1, date: '2025-05-20', notes: 'Price inquiry for pukhraj' }
        ];

        // Services for filter dropdown
        const SAMPLE_SERVICES = [
            { id: 'svc1', name: 'Numerology Reading', icon: 'fa-chart-line', active: true },
            { id: 'svc2', name: 'Vedic Astrology', icon: 'fa-sun', active: true },
            { id: 'svc3', name: 'Gemstone Recommendation', icon: 'fa-gem', active: true },
            { id: 'svc4', name: 'Tarot Card Reading', icon: 'fa-crown', active: true },
            { id: 'svc5', name: 'Vaastu Consultation', icon: 'fa-building', active: true }
        ];

        // Initialize sample data in localStorage if not exists or outdated
        function initSampleDataForInquiries() {
            const flag = localStorage.getItem('astro_sample_inq_initialized');
            if (flag !== SAMPLE_DATA_VERSION_INQ) {
                localStorage.setItem('astronumerics_inquiries', JSON.stringify(SAMPLE_INQUIRIES));
                localStorage.setItem('astronumerics_services', JSON.stringify(SAMPLE_SERVICES));
                localStorage.setItem('astro_sample_inq_initialized', SAMPLE_DATA_VERSION_INQ);
                console.log('✅ Sample inquiries & services data loaded!');
            }
        }

        // ============================================================
        // AN Namespace & Helper Functions
        // ============================================================
        window.AN = window.AN || {};

        AN.Store = {
            get: (key) => {
                const data = localStorage.getItem(key);
                return data ? JSON.parse(data) : [];
            },
            set: (key, value) => localStorage.setItem(key, JSON.stringify(value))
        };

        AN.STORAGE_KEYS = {
            INQUIRIES: 'astronumerics_inquiries',
            SERVICES: 'astronumerics_services'
        };

        AN.genId = () => 'inq_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);

        AN.formatDate = (dateStr) => {
            if (!dateStr) return '—';
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
        };

        AN.todayISO = () => new Date().toISOString().split('T')[0];

        // Toast notifications
        AN.Toast = {
            show: (message, type = 'success') => {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                const bgColor = type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : 'bg-blue-600';
                const icon = type === 'success' ? '<i class="fas fa-check-circle mr-1"></i>' : type === 'error' ? '<i class="fas fa-exclamation-triangle mr-1"></i>' : '<i class="fas fa-info-circle mr-1"></i>';
                toast.className = `${bgColor} text-white text-xs px-4 py-2 rounded-lg shadow-lg toast-animate flex items-center gap-2`;
                toast.innerHTML = `${icon} ${message}`;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 2500);
            },
            success: (msg) => AN.Toast.show(msg, 'success'),
            error: (msg) => AN.Toast.show(msg, 'error'),
            info: (msg) => AN.Toast.show(msg, 'info')
        };

        AN.statusBadge = (status) => {
            const map = {
                'New': '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-blue-100 text-blue-700"><i class="fas fa-plus-circle mr-1 text-[9px]"></i>New</span>',
                'Contacted': '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-amber-100 text-amber-700"><i class="fas fa-phone mr-1 text-[9px]"></i>Contacted</span>',
                'Session Done': '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-green-100 text-green-700"><i class="fas fa-check-circle mr-1 text-[9px]"></i>Session Done</span>',
                'Follow-up': '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-purple-100 text-purple-700"><i class="fas fa-clock mr-1 text-[9px]"></i>Follow-up</span>'
            };
            return map[status] || '<span class="px-2 py-0.5 rounded-full bg-gray-100">—</span>';
        };

        AN.confirmDelete = (name, callback) => {
            const modal = document.getElementById('modal-root');
            document.getElementById('modal-title').innerText = 'Confirm Delete';
            document.getElementById('modal-body').innerHTML = `<p class="text-sm text-[#111844]"><i class="fas fa-exclamation-triangle text-amber-500 mr-2"></i>Are you sure you want to delete "<strong>${escapeHtml(name)}</strong>"? This action cannot be undone.</p>`;
            modal.style.display = 'flex';
            const confirmBtn = document.getElementById('modal-confirm');
            const cancelBtn = document.getElementById('modal-cancel');
            const closeBtn = document.getElementById('modal-close');
            const cleanup = () => {
                modal.style.display = 'none';
                confirmBtn.removeEventListener('click', handler);
                cancelBtn.removeEventListener('click', cleanup);
                closeBtn.removeEventListener('click', cleanup);
            };
            const handler = () => { cleanup(); if (callback) callback(); };
            confirmBtn.addEventListener('click', handler);
            cancelBtn.addEventListener('click', cleanup);
            closeBtn.addEventListener('click', cleanup);
        };

        AN.paginate = (items, page, perPage) => {
            const total = items.length;
            const totalPages = Math.ceil(total / perPage);
            const current = Math.min(Math.max(1, page), totalPages || 1);
            const start = (current - 1) * perPage;
            return { items: items.slice(start, start + perPage), total, current, totalPages, from: start + 1, to: Math.min(start + perPage, total) };
        };

        AN.renderPagination = (containerId, pInfo, onPageChange) => {
            const container = document.getElementById(containerId);
            if (!container) return;
            if (pInfo.totalPages <= 1) { container.innerHTML = ''; return; }
            let html = `<div class="flex items-center gap-1 text-xs"><span class="text-[#7288AE]"><i class="fas fa-list mr-1"></i>${pInfo.from}-${pInfo.to} of ${pInfo.total}</span><div class="flex gap-1">`;
            for (let i = 1; i <= pInfo.totalPages; i++) {
                const active = i === pInfo.current ? 'bg-[#111844] text-[#EAE0CF]' : 'bg-[#EAE0CF] text-[#4B5694] hover:bg-[#4B5694]/10';
                html += `<button data-page="${i}" class="w-7 h-7 rounded ${active} transition-colors">${i}</button>`;
            }
            html += `</div></div>`;
            container.innerHTML = html;
            container.querySelectorAll('[data-page]').forEach(btn => {
                btn.addEventListener('click', (e) => { onPageChange(parseInt(e.target.dataset.page)); });
            });
        };

        AN.exportCSV = (filename, fields, data) => {
            const headers = fields.join(',');
            const rows = data.map(item => fields.map(f => `"${String(item[f] || '').replace(/"/g, '""')}"`).join(','));
            const csv = [headers, ...rows].join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
            URL.revokeObjectURL(link.href);
        };

        AN.openWhatsApp = (mobile, message = '') => {
            const cleanMobile = mobile.replace(/[^0-9]/g, '');
            if (!cleanMobile) return;
            const url = `https://wa.me/91${cleanMobile}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        };

        // Modal handler for add/edit
        function showModal(title, bodyHtml, onConfirm, confirmText = 'Confirm') {
            const modal = document.getElementById('modal-root');
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = bodyHtml;
            document.getElementById('modal-confirm').innerText = confirmText;
            modal.style.display = 'flex';
            const confirmBtn = document.getElementById('modal-confirm');
            const cancelBtn = document.getElementById('modal-cancel');
            const closeBtn = document.getElementById('modal-close');
            const cleanup = () => {
                modal.style.display = 'none';
                confirmBtn.removeEventListener('click', handler);
                cancelBtn.removeEventListener('click', cleanup);
                closeBtn.removeEventListener('click', cleanup);
            };
            const handler = () => {
                if (onConfirm && onConfirm() !== false) cleanup();
                else if (!onConfirm) cleanup();
            };
            confirmBtn.addEventListener('click', handler);
            cancelBtn.addEventListener('click', cleanup);
            closeBtn.addEventListener('click', cleanup);
        }

        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }

        // Set active navigation based on current page
        function setActiveNav() {
            const currentPath = window.location.pathname;
            document.querySelectorAll('[data-nav-link]').forEach(link => {
                link.classList.remove('nav-active');
                const linkPath = link.getAttribute('href');
                if (linkPath === currentPath || (currentPath.includes('inquiries') && linkPath.includes('inquiries'))) {
                    link.classList.add('nav-active');
                }
            });
        }

        // ============================================================
        // MAIN DASHBOARD LOGIC
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            initSampleDataForInquiries();

            let data = AN.Store.get(AN.STORAGE_KEYS.INQUIRIES) || [];
            let services = AN.Store.get(AN.STORAGE_KEYS.SERVICES) || [];
            let currentPage = 1;
            const PER_PAGE = 8;

            function save() { AN.Store.set(AN.STORAGE_KEYS.INQUIRIES, data); }
            function refreshServicesFilter() {
                const select = document.getElementById('filter-service');
                select.innerHTML = '<option value="">All Services</option>' + services.map(s => `<option>${s.name}</option>`).join('');
            }

            function getFiltered() {
                const query = document.getElementById('inq-search').value.toLowerCase();
                const status = document.getElementById('filter-status').value;
                const service = document.getElementById('filter-service').value;
                return data.filter(i => {
                    const matchSearch = (i.name + i.mobile + i.service).toLowerCase().includes(query);
                    const matchStatus = !status || i.status === status;
                    const matchService = !service || i.service === service;
                    return matchSearch && matchStatus && matchService;
                });
            }

            function renderStats() {
                const stats = [
                    { label: 'New', color: 'bg-blue-100 text-blue-700 border border-blue-200', icon: 'fa-plus-circle' },
                    { label: 'Contacted', color: 'bg-amber-100 text-amber-700 border border-amber-200', icon: 'fa-phone' },
                    { label: 'Session Done', color: 'bg-green-100 text-green-700 border border-green-200', icon: 'fa-check-circle' },
                    { label: 'Follow-up', color: 'bg-purple-100 text-purple-700 border border-purple-200', icon: 'fa-clock' }
                ];
                document.getElementById('inq-stats').innerHTML = stats.map(s => `
                    <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg ${s.color} text-xs font-medium border border-current/20">
                        <i class="fas ${s.icon} text-[10px]"></i>
                        <span>${data.filter(d => d.status === s.label).length}</span>
                        <span>${s.label}</span>
                    </div>
                `).join('');
            }

            function renderTable() {
                const filtered = getFiltered();
                const pInfo = AN.paginate(filtered, currentPage, PER_PAGE);
                const tbody = document.getElementById('inq-tbody');
                if (pInfo.items.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="px-4 py-8 text-center text-xs text-[#7288AE]"><i class="fas fa-search mr-2"></i>No inquiries found</td></tr>';
                } else {
                    tbody.innerHTML = pInfo.items.map((inq, idx) => `
                        <tr class="hover:bg-[#EAE0CF]/40 transition-colors">
                            <td class="px-4 py-3 text-[#7288AE]">${pInfo.from + idx}</td>
                            <td class="px-4 py-3">
                                <div class="font-medium text-[#111844]">${escapeHtml(inq.name)}</div>
                                <div class="text-[#7288AE] mt-0.5 text-[10px]"><i class="fas fa-phone-alt mr-1"></i>${inq.mobile}</div>
                            </td>
                            <td class="px-4 py-3 text-[#4B5694]"><i class="fas fa-briefcase mr-1 text-[10px]"></i>${inq.service || '—'}</td>
                            <td class="px-4 py-3">${AN.statusBadge(inq.status)}</td>
                            <td class="px-4 py-3">
                                <button onclick="handleWA('${inq.id}')" class="flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-green-50 text-green-700 border border-green-200 hover:bg-green-100 transition-colors text-xs font-medium">
                                    <i class="fab fa-whatsapp"></i> ${inq.wpClicks || 0}
                                </button>
                            </td>
                            <td class="px-4 py-3 text-[#7288AE]"><i class="far fa-calendar-alt mr-1"></i>${AN.formatDate(inq.date)}</td>
                            <td class="px-4 py-3">
                                <div class="flex items-center gap-1.5">
                                    <button onclick="openEdit('${inq.id}')" class="w-7 h-7 rounded flex items-center justify-center bg-amber-50 text-amber-600 hover:bg-amber-100 transition-colors" title="Edit">
                                        <i class="fas fa-edit text-xs"></i>
                                    </button>
                                    <button onclick="handleDelete('${inq.id}')" class="w-7 h-7 rounded flex items-center justify-center bg-red-50 text-red-600 hover:bg-red-100 transition-colors" title="Delete">
                                        <i class="fas fa-trash-alt text-xs"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `).join('');
                }
                AN.renderPagination('inq-pagination', pInfo, p => { currentPage = p; renderTable(); renderStats(); });
                renderStats();
            }

            function buildForm(inq = {}) {
                const serviceOptions = services.map(s => `<option ${inq.service === s.name ? 'selected' : ''}>${s.name}</option>`).join('');
                return `
                    <div class="space-y-3">
                        <div class="grid grid-cols-2 gap-3">
                            <div><label class="block text-xs font-medium text-[#4B5694] mb-1"><i class="fas fa-user mr-1"></i>Full Name *</label><input name="name" value="${escapeHtml(inq.name || '')}" type="text" class="w-full text-xs px-3 py-2 rounded-lg border border-[#4B5694]/30 bg-[#EAE0CF] focus:outline-none focus:border-[#4B5694]" /></div>
                            <div><label class="block text-xs font-medium text-[#4B5694] mb-1"><i class="fas fa-phone-alt mr-1"></i>Mobile *</label><input name="mobile" value="${inq.mobile || ''}" type="tel" maxlength="10" class="w-full text-xs px-3 py-2 rounded-lg border border-[#4B5694]/30 bg-[#EAE0CF] focus:outline-none focus:border-[#4B5694]" /></div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div><label class="block text-xs font-medium text-[#4B5694] mb-1"><i class="fas fa-briefcase mr-1"></i>Service</label><select name="service" class="w-full text-xs px-3 py-2 rounded-lg border border-[#4B5694]/30 bg-[#EAE0CF]"><option value="">Select service…</option>${serviceOptions}</select></div>
                            <div><label class="block text-xs font-medium text-[#4B5694] mb-1"><i class="fas fa-tag mr-1"></i>Status</label><select name="status" class="w-full text-xs px-3 py-2 rounded-lg border border-[#4B5694]/30 bg-[#EAE0CF]"><option ${inq.status === 'New' ? 'selected' : ''}>New</option><option ${inq.status === 'Contacted' ? 'selected' : ''}>Contacted</option><option ${inq.status === 'Session Done' ? 'selected' : ''}>Session Done</option><option ${inq.status === 'Follow-up' ? 'selected' : ''}>Follow-up</option></select></div>
                        </div>
                        <div><label class="block text-xs font-medium text-[#4B5694] mb-1"><i class="fas fa-sticky-note mr-1"></i>Notes</label><textarea name="notes" rows="2" class="w-full text-xs px-3 py-2 rounded-lg border border-[#4B5694]/30 bg-[#EAE0CF]">${escapeHtml(inq.notes || '')}</textarea></div>
                        <input type="hidden" name="id" value="${inq.id || ''}" />
                    </div>
                `;
            }

            function openAdd() {
                showModal('Add New Inquiry', buildForm(), () => {
                    const name = document.querySelector('#modal-body [name="name"]')?.value.trim();
                    const mobile = document.querySelector('#modal-body [name="mobile"]')?.value.trim();
                    if (!name || !mobile) { AN.Toast.error('Name and mobile are required'); return false; }
                    const newInq = {
                        id: AN.genId(),
                        name, mobile,
                        service: document.querySelector('#modal-body [name="service"]')?.value || '',
                        status: document.querySelector('#modal-body [name="status"]')?.value || 'New',
                        notes: document.querySelector('#modal-body [name="notes"]')?.value || '',
                        wpClicks: 0,
                        date: AN.todayISO()
                    };
                    data.unshift(newInq);
                    save();
                    currentPage = 1;
                    renderTable();
                    AN.Toast.success('Inquiry added successfully!');
                }, 'Add Inquiry');
            }

            window.openEdit = function (id) {
                const inq = data.find(i => i.id === id);
                if (!inq) return;
                showModal('Edit Inquiry', buildForm(inq), () => {
                    const name = document.querySelector('#modal-body [name="name"]')?.value.trim();
                    if (!name) { AN.Toast.error('Name is required'); return false; }
                    inq.name = name;
                    inq.mobile = document.querySelector('#modal-body [name="mobile"]')?.value.trim();
                    inq.service = document.querySelector('#modal-body [name="service"]')?.value;
                    inq.status = document.querySelector('#modal-body [name="status"]')?.value;
                    inq.notes = document.querySelector('#modal-body [name="notes"]')?.value;
                    save();
                    renderTable();
                    AN.Toast.success('Inquiry updated!');
                }, 'Save Changes');
            };

            window.handleDelete = function (id) {
                const inq = data.find(i => i.id === id);
                AN.confirmDelete(inq?.name || 'this inquiry', () => {
                    data = data.filter(i => i.id !== id);
                    save();
                    if (currentPage > 1 && getFiltered().length <= (currentPage - 1) * PER_PAGE) currentPage--;
                    renderTable();
                    AN.Toast.success('Inquiry deleted');
                });
            };

            window.handleWA = function (id) {
                const inq = data.find(i => i.id === id);
                if (!inq) return;
                inq.wpClicks = (inq.wpClicks || 0) + 1;
                save();
                renderTable();
                AN.openWhatsApp(inq.mobile, `Hi ${inq.name}, this is from Astro Numerics regarding your inquiry about ${inq.service}. How can we assist you today?`);
            };

            // Event listeners
            document.getElementById('btn-add-inquiry').addEventListener('click', openAdd);
            document.getElementById('inq-search').addEventListener('input', () => { currentPage = 1; renderTable(); });
            document.getElementById('filter-status').addEventListener('change', () => { currentPage = 1; renderTable(); });
            document.getElementById('filter-service').addEventListener('change', () => { currentPage = 1; renderTable(); });
            document.getElementById('btn-export-csv').addEventListener('click', () => {
                AN.exportCSV('inquiries_export.csv', ['name', 'mobile', 'service', 'status', 'wpClicks', 'date', 'notes'], data);
                AN.Toast.success('Exported CSV');
            });

            // Sidebar + user menu interactions
            let isCollapsed = false;
            const sidebar = document.getElementById('sidebar');
            const mainWrapper = document.getElementById('main-wrapper');
            const sidebarToggle = document.getElementById('sidebar-toggle');
            const overlay = document.getElementById('sidebar-overlay');
            
            sidebarToggle?.addEventListener('click', () => {
                if (window.innerWidth < 1024) {
                    sidebar.classList.toggle('sidebar-open');
                    overlay.classList.toggle('hidden');
                } else {
                    isCollapsed = !isCollapsed;
                    if (isCollapsed) {
                        sidebar.classList.add('sidebar-collapsed');
                        mainWrapper.classList.add('main-expanded');
                        mainWrapper.style.marginLeft = '68px';
                    } else {
                        sidebar.classList.remove('sidebar-collapsed');
                        mainWrapper.classList.remove('main-expanded');
                        mainWrapper.style.marginLeft = '';
                    }
                }
            });
            
            overlay?.addEventListener('click', () => {
                sidebar.classList.remove('sidebar-open');
                overlay.classList.add('hidden');
            });
            
            const userBtn = document.getElementById('user-menu-btn');
            const userMenu = document.getElementById('user-menu');
            userBtn?.addEventListener('click', (e) => { e.stopPropagation(); userMenu.classList.toggle('hidden'); });
            document.addEventListener('click', (e) => { if (!userBtn?.contains(e.target) && !userMenu?.contains(e.target)) userMenu?.classList.add('hidden'); });
            
            // Notification button
            document.getElementById('notif-btn')?.addEventListener('click', () => {
                AN.Toast.info('No new notifications at this time');
            });

            // Set active nav based on current page
            setActiveNav();
            
            refreshServicesFilter();
            renderTable();
        });
    </script>
</body>

</html>
