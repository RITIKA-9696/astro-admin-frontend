  <script>
    // ============================================================
    // COMPLETE SAMPLE DATA MODULE (with auto-initialization)
    // ============================================================
    const SAMPLE_DATA_VERSION_TESTI = 'astro_testi_table_v2';

    // Rich sample testimonials data (12+ records)
    const SAMPLE_TESTIMONIALS = [
      { id: 'test_1', name: 'Priya Sharma', initial: 'PS', service: 'Numerology Reading', rating: 5, review: 'The numerology reading was incredibly accurate! Dr. Sharma helped me understand my life path and career choices. I feel so much more confident about my future now.', status: 'Approved', date: '2025-05-15' },
      { id: 'test_2', name: 'Rahul Mehta', initial: 'RM', service: 'Vedic Astrology', rating: 5, review: 'Amazing astrological insights! The planetary alignment analysis was spot on. Got clarity on my marriage timeline and career prospects.', status: 'Approved', date: '2025-05-10' },
      { id: 'test_3', name: 'Anjali Nair', initial: 'AN', service: 'Gemstone Recommendation', rating: 4, review: 'The gemstone guidance was very helpful. My energy levels have improved significantly since wearing the recommended blue sapphire.', status: 'Approved', date: '2025-05-05' },
      { id: 'test_4', name: 'Vikram Singh', initial: 'VS', service: 'Vaastu Consultation', rating: 5, review: "Vaastu consultation transformed my home's energy. We noticed positive shifts in family harmony and prosperity within weeks.", status: 'Approved', date: '2025-04-28' },
      { id: 'test_5', name: 'Neha Gupta', initial: 'NG', service: 'Tarot Card Reading', rating: 5, review: 'The tarot session was enlightening! Got clear answers about my career transition. The guidance was compassionate and insightful.', status: 'Approved', date: '2025-04-20' },
      { id: 'test_6', name: 'Arjun Reddy', initial: 'AR', service: 'Numerology Reading', rating: 4, review: 'Good experience overall. The name correction suggestion really helped improve my professional life.', status: 'Approved', date: '2025-04-15' },
      { id: 'test_7', name: 'Sneha Desai', initial: 'SD', service: 'Vedic Astrology', rating: 3, review: 'The reading was okay but some predictions haven\'t manifested yet. Customer service was good though.', status: 'Hidden', date: '2025-04-10' },
      { id: 'test_8', name: 'Karthik Iyer', initial: 'KI', service: 'Gemstone Recommendation', rating: 5, review: 'The emerald recommended for my Mercury dasha has brought remarkable career growth. Extremely grateful!', status: 'Approved', date: '2025-04-05' },
      { id: 'test_9', name: 'Divya Menon', initial: 'DM', service: 'Palmistry Analysis', rating: 5, review: 'Fascinating palm reading! Everything mentioned about my life line and fate line was accurate.', status: 'Pending', date: '2025-06-01' },
      { id: 'test_10', name: 'Amit Khanna', initial: 'AK', service: 'Meditation Coaching', rating: 4, review: 'The meditation techniques taught were very effective for my anxiety. Overall great experience.', status: 'Pending', date: '2025-05-30' },
      { id: 'test_11', name: 'Ritu Agarwal', initial: 'RA', service: 'Numerology Reading', rating: 5, review: 'Best numerologist I have consulted! My business has seen remarkable growth after following the recommendations.', status: 'Approved', date: '2025-05-25' },
      { id: 'test_12', name: 'Sunil Kulkarni', initial: 'SK', service: 'Vaastu Consultation', rating: 4, review: 'Good practical advice for office vaastu. Seeing positive changes in team productivity.', status: 'Hidden', date: '2025-05-20' }
    ];

    // Sample services for dropdown
    const SAMPLE_SERVICES_TESTI = [
      { id: 'svc_1', name: 'Numerology Reading' },
      { id: 'svc_2', name: 'Vedic Astrology' },
      { id: 'svc_3', name: 'Gemstone Recommendation' },
      { id: 'svc_4', name: 'Tarot Card Reading' },
      { id: 'svc_5', name: 'Vaastu Consultation' },
      { id: 'svc_6', name: 'Palmistry Analysis' },
      { id: 'svc_7', name: 'Meditation Coaching' }
    ];

    // Initialize sample data in localStorage
    function initSampleTestimonialsData() {
      const flag = localStorage.getItem('astro_sample_testi_table_initialized');
      if (flag !== SAMPLE_DATA_VERSION_TESTI) {
        localStorage.setItem('astronumerics_testimonials', JSON.stringify(SAMPLE_TESTIMONIALS));
        localStorage.setItem('astronumerics_services', JSON.stringify(SAMPLE_SERVICES_TESTI));
        localStorage.setItem('astro_sample_testi_table_initialized', SAMPLE_DATA_VERSION_TESTI);
        console.log('✅ Sample testimonials data loaded!');
      }
    }

    // ============================================================
    // AN Namespace & Helper Functions
    // ============================================================
    window.AN = window.AN || {};

    AN.Store = {
      get: (key) => {
        const data = localStorage.getItem(key);
        return data ? JSON.parse(data) : [];
      },
      set: (key, value) => localStorage.setItem(key, JSON.stringify(value))
    };

    AN.STORAGE_KEYS = {
      TESTIMONIALS: 'astronumerics_testimonials',
      SERVICES: 'astronumerics_services'
    };

    AN.genId = () => 'test_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);

    // Toast notifications
    AN.Toast = {
      show: (message, type = 'success') => {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const toast = document.createElement('div');
        const bgColor = type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : type === 'info' ? 'bg-blue-600' : 'bg-gray-700';
        const icon = type === 'success' ? '<i class="fas fa-check-circle mr-1"></i>' : type === 'error' ? '<i class="fas fa-exclamation-triangle mr-1"></i>' : '<i class="fas fa-info-circle mr-1"></i>';
        toast.className = `${bgColor} text-white text-xs px-4 py-2 rounded-lg shadow-lg toast-animate flex items-center gap-2`;
        toast.innerHTML = `${icon} ${message}`;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
      },
      success: (msg) => AN.Toast.show(msg, 'success'),
      error: (msg) => AN.Toast.show(msg, 'error'),
      info: (msg) => AN.Toast.show(msg, 'info')
    };

    AN.statusBadge = (status) => {
      const map = {
        'Approved': '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-green-100 text-green-700"><i class="fas fa-check-circle mr-1 text-[9px]"></i>Approved</span>',
        'Hidden': '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-gray-100 text-gray-600"><i class="fas fa-eye-slash mr-1 text-[9px]"></i>Hidden</span>',
        'Pending': '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-amber-100 text-amber-700"><i class="fas fa-clock mr-1 text-[9px]"></i>Pending</span>'
      };
      return map[status] || '<span class="px-2 py-0.5 rounded-full bg-gray-100">—</span>';
    };

    AN.starRating = (rating) => {
      const full = '★'.repeat(rating);
      const empty = '☆'.repeat(5 - rating);
      return `<span class="text-amber-500">${full}</span><span class="text-gray-300">${empty}</span>`;
    };

    AN.paginate = (items, page, perPage) => {
      const total = items.length;
      const totalPages = Math.ceil(total / perPage);
      const current = Math.min(Math.max(1, page), totalPages || 1);
      const start = (current - 1) * perPage;
      return { items: items.slice(start, start + perPage), total, current, totalPages, from: start + 1, to: Math.min(start + perPage, total) };
    };

    AN.renderPagination = (containerId, pInfo, onPageChange) => {
      const container = document.getElementById(containerId);
      if (!container) return;
      if (pInfo.totalPages <= 1) { container.innerHTML = ''; return; }
      let html = `<div class="flex items-center gap-1 text-xs"><span class="text-[#7288AE]"><i class="fas fa-list mr-1"></i>${pInfo.from}-${pInfo.to} of ${pInfo.total}</span><div class="flex gap-1">`;
      for (let i = 1; i <= pInfo.totalPages; i++) {
        const active = i === pInfo.current ? 'bg-[#111844] text-[#EAE0CF]' : 'bg-[#EAE0CF] text-[#4B5694] hover:bg-[#4B5694]/10';
        html += `<button data-page="${i}" class="w-7 h-7 rounded ${active} transition-colors">${i}</button>`;
      }
      html += `</div></div>`;
      container.innerHTML = html;
      container.querySelectorAll('[data-page]').forEach(btn => {
        btn.addEventListener('click', (e) => { onPageChange(parseInt(e.target.dataset.page)); });
      });
    };

    AN.exportCSV = (filename, fields, data) => {
      const headers = fields.join(',');
      const rows = data.map(item => fields.map(f => `"${String(item[f] || '').replace(/"/g, '""')}"`).join(','));
      const csv = [headers, ...rows].join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
      URL.revokeObjectURL(link.href);
    };

    AN.confirmDelete = (name, callback) => {
      const modal = document.getElementById('modal-root');
      if (!modal) return;
      document.getElementById('modal-title').innerText = 'Confirm Delete';
      document.getElementById('modal-body').innerHTML = `<p class="text-sm text-[#111844]"><i class="fas fa-exclamation-triangle text-amber-500 mr-2"></i>Are you sure you want to delete "<strong>${escapeHtml(name)}</strong>"? This action cannot be undone.</p>`;
      modal.style.display = 'flex';
      const confirmBtn = document.getElementById('modal-confirm');
      const cancelBtn = document.getElementById('modal-cancel');
      const closeBtn = document.getElementById('modal-close');
      const cleanup = () => {
        modal.style.display = 'none';
        confirmBtn.removeEventListener('click', handler);
        cancelBtn.removeEventListener('click', cleanup);
        closeBtn.removeEventListener('click', cleanup);
      };
      const handler = () => { cleanup(); if (callback) callback(); };
      confirmBtn.addEventListener('click', handler);
      cancelBtn.addEventListener('click', cleanup);
      closeBtn.addEventListener('click', cleanup);
    };

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }

    // Modal handler
    function showModal(title, bodyHtml, onConfirm, confirmText = 'Confirm') {
      const modal = document.getElementById('modal-root');
      if (!modal) return;
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-body').innerHTML = bodyHtml;
      document.getElementById('modal-confirm').innerText = confirmText;
      modal.style.display = 'flex';
      const confirmBtn = document.getElementById('modal-confirm');
      const cancelBtn = document.getElementById('modal-cancel');
      const closeBtn = document.getElementById('modal-close');
      const cleanup = () => {
        modal.style.display = 'none';
        confirmBtn.removeEventListener('click', handler);
        cancelBtn.removeEventListener('click', cleanup);
        closeBtn.removeEventListener('click', cleanup);
      };
      const handler = () => {
        if (onConfirm && onConfirm() !== false) cleanup();
        else if (!onConfirm) cleanup();
      };
      confirmBtn.addEventListener('click', handler);
      cancelBtn.addEventListener('click', cleanup);
      closeBtn.addEventListener('click', cleanup);
    }

    // Set active navigation based on current page
    function setActiveNav() {
      const currentPath = window.location.pathname;
      document.querySelectorAll('[data-nav-link]').forEach(link => {
        link.classList.remove('nav-active');
        const linkPath = link.getAttribute('href');
        if (linkPath === currentPath || (currentPath.includes('testimonials') && linkPath.includes('testimonials'))) {
          link.classList.add('nav-active');
        }
      });
    }

    // ============================================================
    // MAIN DASHBOARD LOGIC
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
      initSampleTestimonialsData();

      let data = AN.Store.get(AN.STORAGE_KEYS.TESTIMONIALS) || [];
      let services = AN.Store.get(AN.STORAGE_KEYS.SERVICES) || [];
      let filterStatus = '';
      let searchQuery = '';
      let currentPage = 1;
      const PER_PAGE = 8;

      function save() { AN.Store.set(AN.STORAGE_KEYS.TESTIMONIALS, data); }

      function getFiltered() {
        let filtered = data;
        if (filterStatus) {
          filtered = filtered.filter(t => t.status === filterStatus);
        }
        if (searchQuery) {
          const query = searchQuery.toLowerCase();
          filtered = filtered.filter(t =>
            t.name.toLowerCase().includes(query) ||
            (t.service && t.service.toLowerCase().includes(query)) ||
            t.review.toLowerCase().includes(query)
          );
        }
        return filtered;
      }

      function renderTable() {
        const filtered = getFiltered();
        const pInfo = AN.paginate(filtered, currentPage, PER_PAGE);
        const tbody = document.getElementById('testi-tbody');
        const emptyDiv = document.getElementById('testi-empty');

        if (pInfo.items.length === 0) {
          tbody.innerHTML = '';
          emptyDiv.style.display = 'block';
        } else {
          emptyDiv.style.display = 'none';
          tbody.innerHTML = pInfo.items.map((t, idx) => `
            <tr class="hover:bg-[#EAE0CF]/40 transition-colors ${t.status === 'Hidden' ? 'opacity-70' : ''}">
              <td class="px-4 py-3 text-[#7288AE]">${pInfo.from + idx}</td>
              <td class="px-4 py-3">
                <div class="flex items-center gap-2">
                  <div class="w-7 h-7 rounded-full bg-[#111844] flex items-center justify-center text-[#EAE0CF] text-[10px] font-bold flex-shrink-0">${escapeHtml(t.initial || t.name.slice(0, 2).toUpperCase())}</div>
                  <div class="font-medium text-[#111844]">${escapeHtml(t.name)}</div>
                </div>
              </td>
              <td class="px-4 py-3 text-[#4B5694]"><i class="fas fa-briefcase mr-1 text-[10px]"></i>${escapeHtml(t.service || '—')}</td>
              <td class="px-4 py-3">${AN.starRating(t.rating)}</td>
              <td class="px-4 py-3 max-w-xs"><div class="truncate max-w-[200px]" title="${escapeHtml(t.review)}"><i class="fas fa-quote-left mr-1 text-[#4B5694] text-[8px]"></i>${escapeHtml(t.review.substring(0, 80))}${t.review.length > 80 ? '...' : ''}</div></td>
              <td class="px-4 py-3">${AN.statusBadge(t.status)}</td>
              <td class="px-4 py-3 text-[#7288AE]"><i class="far fa-calendar-alt mr-1"></i>${t.date || '—'}</td>
              <td class="px-4 py-3">
                <div class="flex items-center gap-1.5">
                  <button data-toggle="${t.id}" class="w-7 h-7 rounded flex items-center justify-center transition-colors ${t.status === 'Approved' ? 'bg-gray-100 text-gray-500 hover:bg-gray-200' : 'bg-green-100 text-green-600 hover:bg-green-200'}" title="${t.status === 'Approved' ? 'Hide' : 'Approve'}">
                    <i class="fas ${t.status === 'Approved' ? 'fa-eye-slash' : 'fa-check-circle'} text-xs"></i>
                  </button>
                  <button data-edit="${t.id}" class="w-7 h-7 rounded flex items-center justify-center bg-amber-50 text-amber-600 hover:bg-amber-100 transition-colors" title="Edit">
                    <i class="fas fa-edit text-xs"></i>
                  </button>
                  <button data-del="${t.id}" class="w-7 h-7 rounded flex items-center justify-center bg-red-50 text-red-600 hover:bg-red-100 transition-colors" title="Delete">
                    <i class="fas fa-trash-alt text-xs"></i>
                  </button>
                </div>
              </td>
             </>
          `).join('');

          // Attach event listeners to buttons
          pInfo.items.forEach(t => {
            const toggleBtn = tbody.querySelector(`[data-toggle="${t.id}"]`);
            const editBtn = tbody.querySelector(`[data-edit="${t.id}"]`);
            const delBtn = tbody.querySelector(`[data-del="${t.id}"]`);

            if (toggleBtn) {
              toggleBtn.addEventListener('click', () => {
                if (t.status === 'Approved') t.status = 'Hidden';
                else if (t.status === 'Hidden') t.status = 'Approved';
                else if (t.status === 'Pending') t.status = 'Approved';
                save();
                renderTable();
                AN.Toast.info(`${t.name}'s review ${t.status.toLowerCase()}`);
              });
            }
            if (editBtn) editBtn.addEventListener('click', () => openEdit(t.id));
            if (delBtn) {
              delBtn.addEventListener('click', () => {
                AN.confirmDelete(`${t.name}'s review`, () => {
                  data = data.filter(i => i.id !== t.id);
                  save();
                  if (currentPage > 1 && getFiltered().length <= (currentPage - 1) * PER_PAGE) currentPage--;
                  renderTable();
                  AN.Toast.success('Testimonial deleted');
                });
              });
            }
          });
        }

        AN.renderPagination('testi-pagination', pInfo, p => { currentPage = p; renderTable(); });
      }

      function buildForm(t = null) {
        const svcOpts = services.map(s => `<option ${t?.service === s.name ? 'selected' : ''}>${escapeHtml(s.name)}</option>`).join('');
        return `<div class="space-y-3">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-[#4B5694] mb-1"><i class="fas fa-user mr-1"></i>Client Name *</label>
              <input name="name" value="${escapeHtml(t?.name || '')}" type="text" placeholder="Priya Sharma" class="w-full text-xs px-3 py-2 rounded-lg border border-[#4B5694]/30 bg-[#EAE0CF] focus:outline-none focus:border-[#4B5694]" required/>
            </div>
            <div>
              <label class="block text-xs font-medium text-[#4B5694] mb-1"><i class="fas fa-signature mr-1"></i>Initials (e.g., PS)</label>
              <input name="initial" value="${escapeHtml(t?.initial || '')}" type="text" maxlength="3" placeholder="PS" class="w-full text-xs px-3 py-2 rounded-lg border border-[#4B5694]/30 bg-[#EAE0CF] focus:outline-none focus:border-[#4B5694]"/>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-[#4B5694] mb-1"><i class="fas fa-briefcase mr-1"></i>Service</label>
              <select name="service" class="w-full text-xs px-3 py-2 rounded-lg border border-[#4B5694]/30 bg-[#EAE0CF] focus:outline-none focus:border-[#4B5694]">
                <option value="">Select service...</option>
                ${svcOpts}
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-[#4B5694] mb-1"><i class="fas fa-star mr-1"></i>Rating</label>
              <select name="rating" class="w-full text-xs px-3 py-2 rounded-lg border border-[#4B5694]/30 bg-[#EAE0CF] focus:outline-none focus:border-[#4B5694]">
                ${[5, 4, 3, 2, 1].map(n => `<option ${(t?.rating || 5) === n ? 'selected' : ''}>${n} ★</option>`).join('')}
              </select>
            </div>
          </div>
          <div>
            <label class="block text-xs font-medium text-[#4B5694] mb-1"><i class="fas fa-align-left mr-1"></i>Review Text *</label>
            <textarea name="review" rows="3" placeholder="Client's feedback..." class="w-full text-xs px-3 py-2 rounded-lg border border-[#4B5694]/30 bg-[#EAE0CF] focus:outline-none focus:border-[#4B5694] resize-none" required>${escapeHtml(t?.review || '')}</textarea>
          </div>
          <div>
            <label class="block text-xs font-medium text-[#4B5694] mb-1"><i class="fas fa-tag mr-1"></i>Status</label>
            <select name="status" class="w-full text-xs px-3 py-2 rounded-lg border border-[#4B5694]/30 bg-[#EAE0CF] focus:outline-none focus:border-[#4B5694]">
              <option ${t?.status === 'Approved' ? 'selected' : ''}>Approved</option>
              <option ${t?.status === 'Hidden' ? 'selected' : ''}>Hidden</option>
              <option ${t?.status === 'Pending' ? 'selected' : ''}>Pending</option>
            </select>
          </div>
          <input name="id" type="hidden" value="${t?.id || ''}"/>
        </div>`;
      }

      function openEdit(id) {
        const testimonial = data.find(t => t.id === id);
        if (!testimonial) return;

        showModal('Edit Testimonial', buildForm(testimonial), () => {
          const nameInput = document.querySelector('#modal-body [name="name"]');
          const reviewInput = document.querySelector('#modal-body [name="review"]');
          const name = nameInput?.value.trim();
          const review = reviewInput?.value.trim();

          if (!name || !review) {
            AN.Toast.error('Name and review are required');
            return false;
          }

          testimonial.name = name;
          testimonial.initial = document.querySelector('#modal-body [name="initial"]')?.value.trim().toUpperCase() || name.slice(0, 2).toUpperCase();
          testimonial.service = document.querySelector('#modal-body [name="service"]')?.value || '';
          testimonial.rating = parseInt(document.querySelector('#modal-body [name="rating"]')?.value) || 5;
          testimonial.review = review;
          testimonial.status = document.querySelector('#modal-body [name="status"]')?.value || 'Pending';

          save();
          renderTable();
          AN.Toast.success('Testimonial updated!');
        }, 'Save Changes');
      }

      // Add new testimonial
      document.getElementById('btn-add-testi')?.addEventListener('click', () => {
        showModal('Add Testimonial', buildForm(null), () => {
          const nameInput = document.querySelector('#modal-body [name="name"]');
          const reviewInput = document.querySelector('#modal-body [name="review"]');
          const name = nameInput?.value.trim();
          const review = reviewInput?.value.trim();

          if (!name || !review) {
            AN.Toast.error('Name and review are required');
            return false;
          }

          const initial = document.querySelector('#modal-body [name="initial"]')?.value.trim().toUpperCase() || name.slice(0, 2).toUpperCase();
          const newTestimonial = {
            id: AN.genId(),
            name: name,
            initial: initial,
            service: document.querySelector('#modal-body [name="service"]')?.value || '',
            rating: parseInt(document.querySelector('#modal-body [name="rating"]')?.value) || 5,
            review: review,
            status: document.querySelector('#modal-body [name="status"]')?.value || 'Pending',
            date: new Date().toISOString().split('T')[0]
          };

          data.unshift(newTestimonial);
          save();
          currentPage = 1;
          renderTable();
          AN.Toast.success('Testimonial added successfully!');
        }, 'Add Testimonial');
      });

      // Export CSV
      document.getElementById('btn-export-csv')?.addEventListener('click', () => {
        AN.exportCSV('testimonials_export.csv', ['name', 'service', 'rating', 'review', 'status', 'date'], getFiltered());
        AN.Toast.success('Exported to CSV');
      });

      // Search input
      const searchInput = document.getElementById('testi-search');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          searchQuery = e.target.value;
          currentPage = 1;
          renderTable();
        });
      }

      // Filter buttons
      const filterContainer = document.getElementById('testi-filter-btns');
      if (filterContainer) {
        filterContainer.addEventListener('click', (e) => {
          const btn = e.target.closest('[data-filter]');
          if (!btn) return;
          filterStatus = btn.dataset.filter;
          currentPage = 1;
          document.querySelectorAll('.filter-btn').forEach(b => {
            if (b === btn) {
              b.className = 'filter-btn px-3 py-1.5 text-xs rounded-lg bg-[#111844] text-[#EAE0CF] font-medium transition-colors';
            } else {
              b.className = 'filter-btn px-3 py-1.5 text-xs rounded-lg border border-[#4B5694]/30 text-[#4B5694] hover:bg-[#4B5694]/10 transition-colors';
            }
          });
          renderTable();
        });
      }

      // Sidebar toggle functionality
      const sidebarToggle = document.getElementById('sidebar-toggle');
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      let isCollapsed = false;

      if (sidebarToggle) {
        sidebarToggle.addEventListener('click', () => {
          if (window.innerWidth < 1024) {
            sidebar.classList.toggle('sidebar-open');
            overlay?.classList.toggle('hidden');
          } else {
            isCollapsed = !isCollapsed;
            if (isCollapsed) {
              sidebar.classList.add('sidebar-collapsed');
              const mainWrapper = document.getElementById('main-wrapper');
              mainWrapper.classList.add('main-expanded');
              mainWrapper.style.marginLeft = '68px';
            } else {
              sidebar.classList.remove('sidebar-collapsed');
              const mainWrapper = document.getElementById('main-wrapper');
              mainWrapper.classList.remove('main-expanded');
              mainWrapper.style.marginLeft = '';
            }
          }
        });
      }

      overlay?.addEventListener('click', () => {
        sidebar?.classList.remove('sidebar-open');
        overlay.classList.add('hidden');
      });

      // User menu dropdown
      const userMenuBtn = document.getElementById('user-menu-btn');
      const userMenu = document.getElementById('user-menu');
      if (userMenuBtn && userMenu) {
        userMenuBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          userMenu.classList.toggle('hidden');
        });
        document.addEventListener('click', (e) => {
          if (!userMenuBtn.contains(e.target) && !userMenu.contains(e.target)) {
            userMenu.classList.add('hidden');
          }
        });
      }

      // Notification button
      document.getElementById('notif-btn')?.addEventListener('click', () => {
        AN.Toast.info('No new notifications at this time');
      });

      setActiveNav();
      renderTable();
    });
  </script>
</body>

</html>
