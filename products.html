    <script>
        // ============================================================
        // COMPLETE SAMPLE DATA MODULE (with auto-initialization)
        // ============================================================
        const SAMPLE_DATA_VERSION_PROD = 'astro_prod_v3';

        // Rich sample products data with quantity
        const SAMPLE_PRODUCTS = [
            { id: 'prod_1', name: 'Rudraksha Mala (5 Mukhi)', category: 'Mala & Beads', price: 1299, quantity: 25, inStock: true, description: 'Authentic Nepalese 5 Mukhi Rudraksha mala for peace and prosperity' },
            { id: 'prod_2', name: 'Pyramid Yantra - Copper', category: 'Yantra', price: 850, quantity: 12, inStock: true, description: 'Copper pyramid yantra for wealth and abundance' },
            { id: 'prod_3', name: 'Blue Sapphire (Neelam)', category: 'Gemstone', price: 3499, quantity: 0, inStock: false, description: 'Certified natural blue sapphire for Saturn influence' },
            { id: 'prod_4', name: 'Moon Phase Calendar 2025', category: 'Astrology Tools', price: 599, quantity: 8, inStock: true, description: 'Complete moon phase calendar with auspicious dates' },
            { id: 'prod_5', name: 'Meditation Beads (Crystal)', category: 'Mala & Beads', price: 450, quantity: 50, inStock: true, description: 'Clear quartz meditation beads for clarity' },
            { id: 'prod_6', name: 'Sri Yantra (Gold Plated)', category: 'Yantra', price: 1899, quantity: 5, inStock: true, description: 'Gold plated Sri Yantra for cosmic energy' },
            { id: 'prod_7', name: 'Yellow Sapphire (Pukhraj)', category: 'Gemstone', price: 4250, quantity: 3, inStock: true, description: 'Certified yellow sapphire for Jupiter blessings' },
            { id: 'prod_8', name: 'Tulsi Mala', category: 'Mala & Beads', price: 350, quantity: 0, inStock: false, description: 'Sacred Tulsi beads for spiritual practice' },
            { id: 'prod_9', name: 'Vastu Compass', category: 'Astrology Tools', price: 1299, quantity: 2, inStock: true, description: 'Professional Vastu compass for directional alignment' },
            { id: 'prod_10', name: 'Emerald (Panna)', category: 'Gemstone', price: 2899, quantity: 7, inStock: true, description: 'Natural emerald for Mercury strength' }
        ];

        // Sample categories
        const SAMPLE_CATEGORIES = ['Mala & Beads', 'Yantra', 'Gemstone', 'Astrology Tools', 'Books', 'Incense & Oils'];

        // Initialize sample data
        function initSampleProductsData() {
            const flag = localStorage.getItem('astro_sample_prod_initialized');
            if (flag !== SAMPLE_DATA_VERSION_PROD) {
                localStorage.setItem('astronumerics_products', JSON.stringify(SAMPLE_PRODUCTS));
                localStorage.setItem('astronumerics_categories', JSON.stringify(SAMPLE_CATEGORIES));
                localStorage.setItem('astro_sample_prod_initialized', SAMPLE_DATA_VERSION_PROD);
                console.log('✅ Sample products data loaded with quantity!');
            }
        }

        // ============================================================
        // AN Namespace & Helper Functions
        // ============================================================
        window.AN = window.AN || {};

        AN.Store = {
            get: (key) => {
                const data = localStorage.getItem(key);
                return data ? JSON.parse(data) : [];
            },
            set: (key, value) => localStorage.setItem(key, JSON.stringify(value))
        };

        AN.STORAGE_KEYS = {
            PRODUCTS: 'astronumerics_products',
            CATEGORIES: 'astronumerics_categories'
        };

        AN.genId = () => 'prod_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);

        // Toast notifications
        AN.Toast = {
            show: (message, type = 'success') => {
                const container = document.getElementById('toast-container');
                if (!container) return;
                const toast = document.createElement('div');
                const bgColor = type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : type === 'info' ? 'bg-blue-600' : 'bg-gray-700';
                const icon = type === 'success' ? '<i class="fas fa-check-circle mr-1"></i>' : type === 'error' ? '<i class="fas fa-exclamation-triangle mr-1"></i>' : '<i class="fas fa-info-circle mr-1"></i>';
                toast.className = `${bgColor} text-white text-xs px-4 py-2 rounded-lg shadow-lg toast-animate flex items-center gap-2`;
                toast.innerHTML = `${icon} ${message}`;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 2500);
            },
            success: (msg) => AN.Toast.show(msg, 'success'),
            error: (msg) => AN.Toast.show(msg, 'error'),
            info: (msg) => AN.Toast.show(msg, 'info')
        };

        AN.paginate = (items, page, perPage) => {
            const total = items.length;
            const totalPages = Math.ceil(total / perPage);
            const current = Math.min(Math.max(1, page), totalPages || 1);
            const start = (current - 1) * perPage;
            return { items: items.slice(start, start + perPage), total, current, totalPages, from: start + 1, to: Math.min(start + perPage, total) };
        };

        AN.renderPagination = (containerId, pInfo, onPageChange) => {
            const container = document.getElementById(containerId);
            if (!container) return;
            if (pInfo.totalPages <= 1) { container.innerHTML = ''; return; }
            let html = `<div class="flex items-center gap-1 text-xs"><span class="text-[#7288AE]"><i class="fas fa-list mr-1"></i>${pInfo.from}-${pInfo.to} of ${pInfo.total}</span><div class="flex gap-1">`;
            for (let i = 1; i <= pInfo.totalPages; i++) {
                const active = i === pInfo.current ? 'bg-[#111844] text-[#EAE0CF]' : 'bg-[#EAE0CF] text-[#4B5694] hover:bg-[#4B5694]/10';
                html += `<button data-page="${i}" class="w-7 h-7 rounded ${active} transition-colors">${i}</button>`;
            }
            html += `</div></div>`;
            container.innerHTML = html;
            container.querySelectorAll('[data-page]').forEach(btn => {
                btn.addEventListener('click', (e) => { onPageChange(parseInt(e.target.dataset.page)); });
            });
        };

        AN.exportCSV = (filename, fields, data) => {
            const headers = fields.join(',');
            const rows = data.map(item => fields.map(f => `"${String(item[f] || '').replace(/"/g, '""')}"`).join(','));
            const csv = [headers, ...rows].join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
            URL.revokeObjectURL(link.href);
        };

        AN.confirmDelete = (name, callback) => {
            const modal = document.getElementById('modal-root');
            if (!modal) return;
            document.getElementById('modal-title').innerText = 'Confirm Delete';
            document.getElementById('modal-body').innerHTML = `<p class="text-sm text-[#111844]"><i class="fas fa-exclamation-triangle text-amber-500 mr-2"></i>Are you sure you want to delete "<strong>${escapeHtml(name)}</strong>"? This action cannot be undone.</p>`;
            modal.style.display = 'flex';
            const confirmBtn = document.getElementById('modal-confirm');
            const cancelBtn = document.getElementById('modal-cancel');
            const closeBtn = document.getElementById('modal-close');
            const cleanup = () => {
                modal.style.display = 'none';
                confirmBtn.removeEventListener('click', handler);
                cancelBtn.removeEventListener('click', cleanup);
                closeBtn.removeEventListener('click', cleanup);
            };
            const handler = () => { cleanup(); if (callback) callback(); };
            confirmBtn.addEventListener('click', handler);
            cancelBtn.addEventListener('click', cleanup);
            closeBtn.addEventListener('click', cleanup);
        };

        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }

        function formatPrice(price) { return `₹${price.toLocaleString('en-IN')}`; }

        // Modal handler
        function showModal(title, bodyHtml, onConfirm, confirmText = 'Confirm') {
            const modal = document.getElementById('modal-root');
            if (!modal) return;
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = bodyHtml;
            document.getElementById('modal-confirm').innerText = confirmText;
            modal.style.display = 'flex';
            const confirmBtn = document.getElementById('modal-confirm');
            const cancelBtn = document.getElementById('modal-cancel');
            const closeBtn = document.getElementById('modal-close');
            const cleanup = () => {
                modal.style.display = 'none';
                confirmBtn.removeEventListener('click', handler);
                cancelBtn.removeEventListener('click', cleanup);
                closeBtn.removeEventListener('click', cleanup);
            };
            const handler = () => {
                if (onConfirm && onConfirm() !== false) cleanup();
                else if (!onConfirm) cleanup();
            };
            confirmBtn.addEventListener('click', handler);
            cancelBtn.addEventListener('click', cleanup);
            closeBtn.addEventListener('click', cleanup);
        }

        // Set active navigation based on current page
        function setActiveNav() {
            const currentPath = window.location.pathname;
            document.querySelectorAll('[data-nav-link]').forEach(link => {
                link.classList.remove('nav-active');
                const linkPath = link.getAttribute('href');
                if (linkPath === currentPath || (currentPath.includes('products') && linkPath.includes('products'))) {
                    link.classList.add('nav-active');
                }
            });
        }

        // ============================================================
        // MAIN DASHBOARD LOGIC
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            initSampleProductsData();

            let data = AN.Store.get(AN.STORAGE_KEYS.PRODUCTS) || [];
            let categories = AN.Store.get(AN.STORAGE_KEYS.CATEGORIES) || SAMPLE_CATEGORIES;
            let searchQuery = '';
            let categoryFilter = '';
            let stockFilter = '';
            let currentPage = 1;
            const PER_PAGE = 10;

            function save() { AN.Store.set(AN.STORAGE_KEYS.PRODUCTS, data); }

            function getFiltered() {
                let filtered = [...data];
                if (searchQuery) {
                    const query = searchQuery.toLowerCase();
                    filtered = filtered.filter(p =>
                        p.name.toLowerCase().includes(query) ||
                        p.category.toLowerCase().includes(query) ||
                        (p.description && p.description.toLowerCase().includes(query))
                    );
                }
                if (categoryFilter) {
                    filtered = filtered.filter(p => p.category === categoryFilter);
                }
                if (stockFilter === 'in') {
                    filtered = filtered.filter(p => p.inStock === true && (p.quantity || 0) > 0);
                } else if (stockFilter === 'out') {
                    filtered = filtered.filter(p => p.inStock === false || (p.quantity || 0) === 0);
                }
                return filtered;
            }

            function renderStats() {
                const total = data.length;
                const inStock = data.filter(p => p.inStock === true && (p.quantity || 0) > 0).length;
                const outStock = data.filter(p => p.inStock === false || (p.quantity || 0) === 0).length;
                const totalQuantity = data.reduce((sum, p) => sum + (p.quantity || 0), 0);

                document.getElementById('product-stats').innerHTML = `
                    <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-blue-100 text-blue-700 text-xs font-medium border border-blue-200">
                        <i class="fas fa-boxes"></i><span>${total}</span><span>Total</span>
                    </div>
                    <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-green-100 text-green-700 text-xs font-medium border border-green-200">
                        <i class="fas fa-check-circle"></i><span>${inStock}</span><span>In Stock</span>
                    </div>
                    <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-red-100 text-red-700 text-xs font-medium border border-red-200">
                        <i class="fas fa-times-circle"></i><span>${outStock}</span><span>Out of Stock</span>
                    </div>
                    <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-purple-100 text-purple-700 text-xs font-medium border border-purple-200">
                        <i class="fas fa-calculator"></i><span>${totalQuantity}</span><span>Total Qty</span>
                    </div>
                `;
            }

            function updateQuantity(productId, newQuantity) {
                const product = data.find(p => p.id === productId);
                if (product) {
                    product.quantity = Math.max(0, newQuantity);
                    product.inStock = product.quantity > 0;
                    save();
                    renderTable();
                    renderStats();
                    AN.Toast.info(`${product.name} quantity updated to ${product.quantity}`);
                }
            }

            function renderTable() {
                const filtered = getFiltered();
                const pInfo = AN.paginate(filtered, currentPage, PER_PAGE);
                const tbody = document.getElementById('product-tbody');
                const emptyDiv = document.getElementById('product-empty');

                if (pInfo.items.length === 0) {
                    tbody.innerHTML = '';
                    emptyDiv.style.display = 'block';
                } else {
                    emptyDiv.style.display = 'none';
                    tbody.innerHTML = pInfo.items.map((p, idx) => `
                        <tr class="hover:bg-[#EAE0CF]/40 transition-colors">
                            <td class="px-4 py-3 text-[#7288AE]">${pInfo.from + idx}</td>
                            <td class="px-4 py-3">
                                <div>
                                    <div class="font-medium text-[#111844]">${escapeHtml(p.name)}</div>
                                    <div class="text-[10px] text-[#7288AE] mt-0.5 truncate max-w-[200px]"><i class="fas fa-align-left mr-1 text-[8px]"></i>${escapeHtml(p.description ? p.description.substring(0, 50) : '')}${p.description && p.description.length > 50 ? '...' : ''}</div>
                                </div>
                            </td>
                            <td class="px-4 py-3"><span class="px-2 py-1 rounded-full bg-[#EAE0CF] text-[#4B5694] text-[10px]"><i class="fas fa-tag mr-1"></i>${escapeHtml(p.category)}</span></td>
                            <td class="px-4 py-3 font-semibold text-[#111844]"><i class="fas fa-rupee-sign mr-1 text-[#4B5694]"></i>${formatPrice(p.price)}</td>
                            <td class="px-4 py-3">
                                <div class="flex items-center gap-2">
                                    <span class="font-bold text-[#111844] text-sm">${p.quantity || 0}</span>
                                </div>
                            </td>
                            <td class="px-4 py-3">
                                <span class="inline-flex items-center px-2 py-1 rounded-full text-[10px] font-medium ${p.inStock && (p.quantity || 0) > 0 ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-600'}">
                                    <i class="fas ${p.inStock && (p.quantity || 0) > 0 ? 'fa-check-circle' : 'fa-times-circle'} mr-1"></i>
                                    ${p.inStock && (p.quantity || 0) > 0 ? 'In Stock' : 'Out of Stock'}
                                </span>
                            </td>
                            <td class="px-4 py-3">
                                <div class="flex items-center gap-1.5">
                                    <button data-edit="${p.id}" class="w-7 h-7 rounded flex items-center justify-center bg-amber-50 text-amber-600 hover:bg-amber-100 transition-colors" title="Edit Product">
                                        <i class="fas fa-edit text-xs"></i>
                                    </button>
                                    <button data-del="${p.id}" class="w-7 h-7 rounded flex items-center justify-center bg-red-50 text-red-600 hover:bg-red-100 transition-colors" title="Delete Product">
                                        <i class="fas fa-trash-alt text-xs"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `).join('');

                    // Attach event listeners
                    pInfo.items.forEach(p => {
                        const editBtn = tbody.querySelector(`[data-edit="${p.id}"]`);
                        const delBtn = tbody.querySelector(`[data-del="${p.id}"]`);

                        if (editBtn) editBtn.addEventListener('click', () => openEdit(p.id));
                        if (delBtn) {
                            delBtn.addEventListener('click', () => {
                                AN.confirmDelete(p.name, () => {
                                    data = data.filter(i => i.id !== p.id);
                                    save();
                                    if (currentPage > 1 && getFiltered().length <= (currentPage - 1) * PER_PAGE) currentPage--;
                                    renderTable();
                                    renderStats();
                                    AN.Toast.success('Product deleted');
                                });
                            });
                        }
                    });
                }

                AN.renderPagination('product-pagination', pInfo, p => { currentPage = p; renderTable(); });
                renderStats();
            }

            function buildForm(product = null) {
                const categoryOptions = categories.map(cat => `<option ${product?.category === cat ? 'selected' : ''}>${escapeHtml(cat)}</option>`).join('');
                return `<div class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-[#4B5694] mb-1"><i class="fas fa-tag mr-1"></i>Product Name *</label>
                        <input name="name" value="${escapeHtml(product?.name || '')}" type="text" placeholder="e.g., Rudraksha Mala" class="w-full text-xs px-3 py-2 rounded-lg border border-[#4B5694]/30 bg-[#EAE0CF] focus:outline-none focus:border-[#4B5694]" required/>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-[#4B5694] mb-1"><i class="fas fa-folder mr-1"></i>Category</label>
                            <select name="category" class="w-full text-xs px-3 py-2 rounded-lg border border-[#4B5694]/30 bg-[#EAE0CF] focus:outline-none focus:border-[#4B5694]">
                                <option value="">Select category...</option>
                                ${categoryOptions}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-[#4B5694] mb-1"><i class="fas fa-rupee-sign mr-1"></i>Price (₹) *</label>
                            <input name="price" value="${product?.price || ''}" type="number" step="1" placeholder="1299" class="w-full text-xs px-3 py-2 rounded-lg border border-[#4B5694]/30 bg-[#EAE0CF] focus:outline-none focus:border-[#4B5694]" required/>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-[#4B5694] mb-1"><i class="fas fa-boxes mr-1"></i>Stock Quantity *</label>
                        <input name="quantity" value="${product?.quantity || 0}" type="number" min="0" step="1" placeholder="0" class="w-full text-xs px-3 py-2 rounded-lg border border-[#4B5694]/30 bg-[#EAE0CF] focus:outline-none focus:border-[#4B5694]" required/>
                        <p class="text-[10px] text-[#7288AE] mt-1"><i class="fas fa-info-circle mr-1"></i>Enter the number of items in stock. Set to 0 for out of stock.</p>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-[#4B5694] mb-1"><i class="fas fa-align-left mr-1"></i>Description</label>
                        <textarea name="description" rows="2" placeholder="Product description..." class="w-full text-xs px-3 py-2 rounded-lg border border-[#4B5694]/30 bg-[#EAE0CF] focus:outline-none focus:border-[#4B5694] resize-none">${escapeHtml(product?.description || '')}</textarea>
                    </div>
                    <input name="id" type="hidden" value="${product?.id || ''}"/>
                </div>`;
            }

            function openEdit(id) {
                const product = data.find(p => p.id === id);
                if (!product) return;

                showModal('Edit Product', buildForm(product), () => {
                    const nameInput = document.querySelector('#modal-body [name="name"]');
                    const priceInput = document.querySelector('#modal-body [name="price"]');
                    const quantityInput = document.querySelector('#modal-body [name="quantity"]');
                    const name = nameInput?.value.trim();
                    const price = parseFloat(priceInput?.value);
                    const quantity = parseInt(quantityInput?.value) || 0;

                    if (!name) { AN.Toast.error('Product name is required'); return false; }
                    if (!price || isNaN(price) || price <= 0) { AN.Toast.error('Valid price is required'); return false; }

                    product.name = name;
                    product.category = document.querySelector('#modal-body [name="category"]')?.value || '';
                    product.price = price;
                    product.quantity = quantity;
                    product.inStock = quantity > 0;
                    product.description = document.querySelector('#modal-body [name="description"]')?.value.trim() || '';

                    save();
                    renderTable();
                    AN.Toast.success('Product updated!');
                }, 'Save Changes');
            }

            // Add new product
            document.getElementById('btn-add-product')?.addEventListener('click', () => {
                showModal('Add New Product', buildForm(null), () => {
                    const nameInput = document.querySelector('#modal-body [name="name"]');
                    const priceInput = document.querySelector('#modal-body [name="price"]');
                    const quantityInput = document.querySelector('#modal-body [name="quantity"]');
                    const name = nameInput?.value.trim();
                    const price = parseFloat(priceInput?.value);
                    const quantity = parseInt(quantityInput?.value) || 0;

                    if (!name) { AN.Toast.error('Product name is required'); return false; }
                    if (!price || isNaN(price) || price <= 0) { AN.Toast.error('Valid price is required'); return false; }

                    const newProduct = {
                        id: AN.genId(),
                        name: name,
                        category: document.querySelector('#modal-body [name="category"]')?.value || '',
                        price: price,
                        quantity: quantity,
                        inStock: quantity > 0,
                        description: document.querySelector('#modal-body [name="description"]')?.value.trim() || ''
                    };

                    data.unshift(newProduct);
                    save();
                    currentPage = 1;
                    renderTable();
                    AN.Toast.success('Product added successfully!');
                }, 'Add Product');
            });

            // Update category filter dropdown
            function updateCategoryFilter() {
                const select = document.getElementById('filter-category');
                if (select) {
                    select.innerHTML = '<option value="">All Categories</option>' + categories.map(c => `<option>${escapeHtml(c)}</option>`).join('');
                }
            }

            // Export CSV
            document.getElementById('btn-export-csv')?.addEventListener('click', () => {
                AN.exportCSV('products_export.csv', ['name', 'category', 'price', 'quantity', 'inStock', 'description'], getFiltered());
                AN.Toast.success('Exported to CSV');
            });

            // Search input
            const searchInput = document.getElementById('product-search');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    searchQuery = e.target.value;
                    currentPage = 1;
                    renderTable();
                });
            }

            // Category filter
            const categoryFilterEl = document.getElementById('filter-category');
            if (categoryFilterEl) {
                categoryFilterEl.addEventListener('change', (e) => {
                    categoryFilter = e.target.value;
                    currentPage = 1;
                    renderTable();
                });
            }

            // Stock filter
            const stockFilterEl = document.getElementById('filter-stock');
            if (stockFilterEl) {
                stockFilterEl.addEventListener('change', (e) => {
                    stockFilter = e.target.value;
                    currentPage = 1;
                    renderTable();
                });
            }

            updateCategoryFilter();

            // Sidebar toggle functionality
            const sidebarToggle = document.getElementById('sidebar-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            let isCollapsed = false;

            if (sidebarToggle) {
                sidebarToggle.addEventListener('click', () => {
                    if (window.innerWidth < 1024) {
                        sidebar.classList.toggle('sidebar-open');
                        overlay?.classList.toggle('hidden');
                    } else {
                        isCollapsed = !isCollapsed;
                        if (isCollapsed) {
                            sidebar.classList.add('sidebar-collapsed');
                            const mainWrapper = document.getElementById('main-wrapper');
                            mainWrapper.classList.add('main-expanded');
                            mainWrapper.style.marginLeft = '68px';
                        } else {
                            sidebar.classList.remove('sidebar-collapsed');
                            const mainWrapper = document.getElementById('main-wrapper');
                            mainWrapper.classList.remove('main-expanded');
                            mainWrapper.style.marginLeft = '';
                        }
                    }
                });
            }

            overlay?.addEventListener('click', () => {
                sidebar?.classList.remove('sidebar-open');
                overlay.classList.add('hidden');
            });

            // User menu dropdown
            const userMenuBtn = document.getElementById('user-menu-btn');
            const userMenu = document.getElementById('user-menu');
            if (userMenuBtn && userMenu) {
                userMenuBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    userMenu.classList.toggle('hidden');
                });
                document.addEventListener('click', (e) => {
                    if (!userMenuBtn.contains(e.target) && !userMenu.contains(e.target)) {
                        userMenu.classList.add('hidden');
                    }
                });
            }

            // Notification button
            document.getElementById('notif-btn')?.addEventListener('click', () => {
                AN.Toast.info('No new notifications at this time');
            });

            setActiveNav();
            renderTable();
        });
    </script>
</body>

</html>
